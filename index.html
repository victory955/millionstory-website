const JR=[{"slug": "notes-from-a-reader", "cat": "Life", "title": "Notes from a Reader", "date": "Sep 28, 2026", "img": "pen", "excerpt": "Some things about reading are hard to explain, like why one sentence stays with you for years while hundreds of others disappear.", "body": [["p", "Some things about reading are hard to explain, like why you remember exactly where you were when you read a certain book, or why one sentence stays with you for years while hundreds of others quietly disappear."], ["p", "Some books arrive at the wrong time. You can read ten pages and feel nothing. Then, two years later, you open the same book and wonder how you ever missed it."], ["p", "Some characters become strangely familiar. You know they aren't real, you know their lives exist only on paper, and yet you find yourself wondering what they would do in a situation that has nothing to do with the story at all."], ["p", "We underline things we don't fully understand yet. A sentence can mean very little the first time we read it. Then life happens, and we come back to find we suddenly understand exactly why we marked it."], ["p", "And sometimes the best thing a book can do is make us look up, away from the page, away from the noise, and back at our own lives."], ["p", "Maybe that's why we keep returning to books. Not because every book changes us. But because, every now and then, one does."]]}, {"slug": "care-for-slower-reading", "cat": "Reading", "title": "Care for Slower Reading", "date": "Oct 10, 2026", "img": "sun", "excerpt": "Somewhere along the way, reading became another thing to keep up with. Maybe we don't need to read more. Maybe we need to read slower.", "body": [["p", "There was a time when reading didn't feel like something we had to be good at. You picked up a book because you wanted to know what happened next, read a few pages before bed, carried it with you somewhere, stopped halfway through because someone called your name, and came back to it later. There was no target, no streak, no number of books you were supposed to finish by the end of the month. You were simply reading."], ["p", "Somewhere along the way, reading became another thing to keep up with. We count how many books we've read. We make lists of what we want to finish. We photograph them, post them, set challenges for ourselves. There's nothing wrong with any of that, but sometimes it's worth asking whether, in trying to read more, we've forgotten how to read slowly."], ["h", "The strange pressure to finish"], ["p", "A book can start to feel demanding the moment we treat it like a task. We think about how many pages are left, calculate how long it will take, wonder whether we're reading quickly enough, and something that was supposed to take us somewhere begins to feel like somewhere we have to get through."], ["p", "Perhaps that's why so many people say they want to read more but struggle to actually sit down with a book. It isn't that they stopped loving stories. Maybe they simply grew tired of turning reading into work."], ["p", "There's something different about reading when you have nowhere else to be, when you can stop at a sentence because it catches you, reread a paragraph because you liked the sound of it, or put the book down for a moment because a character said something that stayed with you. None of that looks especially productive. It might be the whole point."], ["h", "We are surrounded by speed"], ["p", "Almost everything around us moves quickly. Messages arrive instantly. Videos get shorter. News comes in headlines. We scroll past hundreds of things without staying with any of them for long, and even when something interests us, there's usually another thing waiting right underneath it."], ["p", "Reading asks for something different. It asks you to stay, not forever, just long enough. Long enough for a sentence to settle, for a character to become familiar, for a world that didn't exist in your mind ten minutes ago to start feeling real."], ["p", "That kind of attention can feel uncomfortable once we've grown used to constant movement. But discomfort isn't always a sign that something is wrong. Sometimes it's simply what happens when we slow down."], ["h", "The book you don't finish"], ["p", "It's worth saying something about the books we never finish: you're allowed to leave one. A book isn't a contract. Sometimes the timing is wrong, sometimes the story isn't for you, and sometimes you simply don't want to know what happens next."], ["p", "And sometimes you put a book down for six months and discover you weren't finished with it after all, you just weren't ready yet."], ["p", "There's a strange freedom in knowing you don't have to conquer every book you begin. Reading isn't a competition. The book doesn't care how quickly you finish it, and maybe neither should you."], ["h", "Coming back"], ["p", "Maybe the answer isn't finding more time to read, but learning to treat reading differently. Put your phone somewhere you can't reach it. Read ten pages, and don't worry about whether ten pages is enough. If you want to stop, stop. If you want to continue, continue."], ["p", "Let yourself read badly sometimes. Let your focus wander and come back. Let yourself spend twenty minutes on the same page because your mind went somewhere else. There's no perfect way to return to reading, only the moment you pick up a book again, and that's usually enough."], ["p", "Because books were never meant to be another thing we hurry through. They offer something much of modern life rarely does: a reason to stay in one place for a while. So maybe we don't need to read more. Maybe, for a little while, we just need to read slower."]]}, {"slug": "the-rise-of-the-book-club", "cat": "Books", "title": "The Rise of the Book Club", "date": "Oct 2, 2026", "img": "books", "excerpt": "You come together to talk about a book. You often leave having talked about yourselves.", "body": [["p", "There's something slightly strange about a book club: a group of people voluntarily agree to read the same book, meet somewhere, and then spend an evening discussing fictional people as though they were mutual acquaintances. And somehow, it works."], ["p", "Reading is usually a solitary thing. You sit alone with a book, turn the pages alone, and the story unfolds somewhere inside your own head. A book club changes that. Suddenly your favourite character belongs to someone else's imagination too, someone hated the person you loved, someone noticed something you missed entirely, someone read the ending completely differently. The book becomes bigger than its pages."], ["p", "Perhaps that's why book clubs continue to matter, not because everyone needs another social activity, but because books give people something worth gathering around. So much of our lives now happens through short messages, quick reactions and passing conversation. A book asks us to sit down and actually talk."], ["p", "And rarely just about the book. A good book club conversation has a way of turning into a conversation about family, relationships, fear, ambition, grief, love, or the strange decisions people make. The book simply gives everyone somewhere to begin."], ["p", "Maybe that's the real magic of it. You come together to talk about a book. You often leave having talked about yourselves."]]}, {"slug": "what-makes-a-story-last", "cat": "Writing", "title": "What Makes a Story Last?", "date": "Oct 6, 2026", "img": "shelf", "excerpt": "Not how loudly a story announces itself, but how quietly it stays with us after we've finished reading.", "body": [["p", "Some stories disappear almost as soon as we finish them. We close the book, put it back on the shelf, and move on. Then there are the others."], ["p", "Years later, we can still remember a character's name, a particular scene, a sentence we underlined, sometimes without remembering the plot at all, just how the story made us feel."], ["p", "So what makes a story last? Probably not perfection. Some of the books we remember most clearly aren't the ones we'd call flawless. They simply met us at the right moment."], ["p", "A story can attach itself to a particular version of ourselves, the person who read it, the place we read it, whatever was happening in our life at the time. That might be why the same book can mean something entirely different when we return to it years later. The story hasn't necessarily changed. We have."], ["p", "That may be one of the quiet powers of stories: they give us something to carry forward, and sometimes we don't realise what we've carried until much later."], ["p", "A memorable story doesn't always leave us with an answer. Sometimes it leaves us with a question, or changes how we see someone, or simply hands us a sentence we needed at exactly the right moment."], ["p", "Maybe that's what makes a story last, not how loudly it announces itself, but how quietly it stays with us after we've finished reading."]]}];

<section class="sec"><div class="fnd2"><div><div class="k">Meet the Founder</div><h2 class="serif" style="font-size:max(13.5px,calc(40px*var(--fs)));margin:8px 0 16px">Hello, and welcome.</h2><p style="font-size:max(13.5px,calc(18.5px*var(--fs)));line-height:1.7;margin:0 0 14px">I started Million Story because I kept asking myself the same question: what happens when we look beyond the book itself? What if we could talk to the people behind the stories, understand the journey, and discover the bigger picture?</p><p style="font-size:max(13.5px,calc(18.5px*var(--fs)));line-height:1.7;margin:0 0 24px">I\'m building Million Story as a space where books, people and ideas come together, one conversation at a time.</p><div class="signoff"><span class="serif">Victory I.</span><small>Founder, Million Story</small></div><a href="#/contact" class="btn" style="background:transparent;color:var(--ink);border:1px solid var(--line)">Get in touch ${ar}</a></div><blockquote>“Stories aren\'t just meant to be read. They\'re meant to be explored.”<cite>Founder</cite></blockquote></div></section>

const FEATURES=[{

 intro:"George Kerpi writes crime fiction between emergency-room shifts. In <em>Treacherous Path</em> he built a murder investigation around a woman who is no longer there to speak. He tells us why it had to be a novel and not a poem, and the one question he would ask every reader.",
 details:[
  ["The Book","<em>Treacherous Path</em>, published 11 August 2026"],
  ["The Case","A hunting party brings a severed finger wearing a golden ring to the Oak Ridge sheriff’s office. Detective Captain Steven Harlan and his partner, Aaron Chase, are drawn into the disappearance of Dr. Natalie Brooks, a physician at a mountain resort, and find a carefully ordered life with cracks in it."]
 ],
 interview:[
  {q:"Why does Treacherous Path exist?",a:[
   "<strong class='ev'>Books are to teach.</strong> In my case, my book is written in a language that teaches through investigation that no one is truly evil. Any good or bad deed can be understood. Not necessarily agreed with, but understood, if you look at it from the perspective of a person of interest. Six to you is nine to me. Every sinner has a future, and every saint has a past.",
   "Does that explanation diminish the pain caused by the crime? No, it doesn’t. But every pain should be a lesson.",
   "<em>Treacherous Path</em> was supposed to be just an investigation of a crime committed, but I decided to honour Natalie’s memory by making it about each and every person involved. Even the place is involved. Once you read the book you realise the ending makes you ponder your own life. The crime against Natalie was grave, but it was also a scar on the memory of the town. It happened to them and the dwellers of the town. What did it do to the psychology of people who were either involved or heard about it?"]},
  {q:"Is there a character you found particularly difficult, or surprisingly easy, to write?",a:[
   "Natalie was probably the most difficult character for me to write. I wanted to do justice to her memory. The entire book is built around the death of this one person, and in a way, everybody else is just garnish. They’re investigating her, talking about her, remembering her, suspecting each other because of what happened to her, but she isn’t there to speak for herself."]},
  {pull:"If the reader doesn’t care about the person who died, then ultimately, why should they care who killed her?",by:"George Kerpi on writing Natalie"},
  {q:"Why did the character have to be written this way?",a:[
   "That made her difficult for me because I didn’t want Natalie to become simply “the victim.” Natalie may have few opportunities to occupy the page, but she’s the reason any of them occupy it at all."]},
  {q:"Having written both fiction and poetry, what did Treacherous Path let you express that poetry couldn’t?",a:[
   "I love this question, because I asked it of myself. Poetry is a unique way of connecting with the rhyme of a story. You can almost sing poetry. But if you want to immerse yourself in the life of a story, or in the life of an individual character, a novel gives you greater access. It also gives you the simplicity of language that a story sometimes needs. A novel does not have to be memorized. It has to be understood.",
   "Surprisingly, I actually have a version of <em>Treacherous Path</em> that I attempted to write as poetry. I tried because one of the greatest inspirations of my life is the late Shota Rustaveli, the great Georgian poet who wrote <em>The Knight in the Panther’s Skin</em>, a work that has influenced Georgian literature and culture for centuries. To me, he is a divine writer. But as I worked on <em>Treacherous Path</em> in verse, I realised the genre simply did not sit right with the rhyme of the poetry. This story needed the freedom and space of a novel."]},
  {q:"How do you want the book to be remembered?",a:[
   "I want <em>Treacherous Path</em> to be remembered as a reminder to every generation that sometimes bad things happen to good people, and that vigilance is the key to any endeavour, good or bad. I want it to be a type of psychological milestone for every reader. Not necessarily groundbreaking, but something that lets a reader say, “I remember my life before <em>Treacherous Path</em>, and I know my life after.”"]},
  {q:"If you could sit beside one reader immediately after they finished the book, what would you most want to ask them?",a:[
   "The first thing I would ask is very simple: “Did you like it?”",
   "And then I think the rest of my questions would depend entirely on their answer. I would want to know what they liked, what they didn’t, who they believed, what surprised them, and what stayed with them.",
   "But there is one thing I would be most curious about: <strong class='ev'>Are you more of a person after reading <em>Treacherous Path</em> than you were before?</strong>",
   "Because to me, that is what a book should ultimately do. I don’t necessarily mean that it has to teach you something or change your beliefs. But if you spend that much time inside someone else’s fear, loss, suspicion, guilt, innocence, and humanity, I hope you come out of it carrying something you didn’t carry before."]}
 ]
}];

const AUTH=[{"slug": "natasha-l-black", "img": "/img/author-natasha-l-black.jpg", "book": "Scarred Vows", "author": "Natasha L. Black", "genre": "Mafia Romance", "title": "The Architecture of Surrender: How Natasha L. Black Reimagines Power in Dark Romance", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "In contemporary romance fiction, few subgenres spark as much curiosity, or fierce devotion, as mafia romance. On the surface, its staples read like pure escapism: ruthless syndicate bosses and marriages forged in ledger books. Yet for Natasha L. Black, author of Scarred Vows: A Secret Baby, Mafia Romance, the criminal underworld is less an excuse for spectacle than a pressure cooker for human psychology."], ["p", "In Scarred Vows, Emma discovers her wedding is a transaction arranged to settle her father’s debts to Vladimir, a formidable Bratva leader. Rather than glossing over that imbalance, Black uses it as the novel’s dramatic engine."], ["p", "\"When a marriage starts as a financial transaction, neither character can pretend this is a fairytale,\" Black explains. For her, the story only truly begins when both characters dismantle that coercion to make room for genuine choice."], ["h", "Restraint Over Control"], ["p", "Crafting a protagonist like Vladimir requires balancing moral ambiguity with a hero readers can root for. Though he commands a brutal hierarchy, Vladimir refuses to force Emma’s affection, waiting instead for her to say yes on her own terms."], ["p", "\"In dark romance, it is easy to write a man who simply takes what he wants,\" Black notes. \"To me, that’s predictable.\" True strength, she argues, appears in restraint, paired with a strict ethical boundary. While a hero may be merciless to rivals, cruelty toward the heroine is off-limits. \"The moment a hero strips away the heroine's humanity rather than respecting her strength, you lose the romance.\""], ["h", "Reclaiming Agency"], ["p", "In a world where powerful men treat women as collateral, Black ensured Emma’s strength comes from sharp instincts and boundary-setting rather than passive waiting. That resilience is tested most when Emma discovers she is pregnant and delays telling Vladimir."], ["p", "Instead of using the \"secret baby\" trope for mere melodrama, Black uses it to examine the difference between being possessed and truly belonging. \"When your marriage starts as a ledger entry, you question where your value lies,\" she says. \"She has to ask: Will he love me as his wife, or will I simply become more valuable property?\""], ["h", "Beyond the Transaction"], ["p", "Black’s appeal reflects why readers gravitate toward high-stakes romance in uncertain times: stories built on fierce protection and hard-won trust offer real catharsis."], ["p", "Beneath the suspense, Scarred Vows leaves readers with a grounded truth about commitment. A vow forced by circumstance is merely a contract; a marriage only becomes real when two people are free to walk away and choose to stay anyway."], ["p", "\"Your starting point doesn't have to define your ending,\" Black reflects. \"Real loyalty isn't something you can buy or demand; it’s something you earn.\""]], "views": 1790, "bn": 52}, {"slug": "hayley-fleming", "img": "/img/author-hayley-fleming.jpg", "book": "Thighs Wide Shut", "author": "Hayley Fleming", "genre": "Romantic Comedy", "title": "Beyond the Pages: Hayley Fleming on Love, Intimacy, and the Courage to Feel Whole", "dek": "In her debut novel, <em>Thighs Wide Shut</em>, Hayley Fleming explores a side of romance rarely discussed in fiction. Drawing from personal experience, she tells a story about intimacy, vulnerability, and learning to feel at home in one's own body.", "byline": null, "body": [["p", "Romance novels often promise that love will make everything fall into place. But what happens when two people find each other, the feelings are real, and yet the body refuses to follow the script?"], ["p", "It is a question that sits at the heart of Hayley Fleming's debut novel, <em>Thighs Wide Shut</em>. The story follows Emma, a young woman navigating an unexpected second chance at love while confronting a health condition that has made physical intimacy difficult. What appears to be a familiar romance gradually reveals something more personal: an exploration of vulnerability, intimacy, and the complicated relationship between love and the human body."], ["p", "The connection between Fleming and her protagonist is not accidental. Her own experience with vaginismus, a condition that can make penetration painful or difficult, helped shape Emma's journey. But writing the character also brought Fleming face to face with feelings she thought she had already worked through."], ["p", "She describes Emma as sharing her emotional DNA, particularly the fear of being broken or somehow unworthy of a relationship. Even after years of therapy, writing the character made her recognise how much of that fear she still carried. The hardest scenes were not necessarily the physical ones, but the quieter experiences: the anxiety before a date, the loneliness of explaining a condition, and the exhaustion of trying to find words for something difficult to understand."], ["p", "That personal connection also shaped what she wanted to challenge about romance fiction. Having grown up reading the genre, she noticed how often physical intimacy is portrayed as an effortless reward once two people fall in love. Real life, however, is rarely that simple. Love does not automatically remove anxiety, trauma, or medical difficulties."], ["p", "Fleming wanted to show that when physical intimacy does not follow the familiar script, a relationship has not necessarily failed. Patience, communication, and vulnerability can create a deeper connection than physical attraction alone."], ["p", "Her perspective raises an interesting question: why do we so often measure romantic relationships by how easily two people fit together, rather than by how they understand and support each other when things become difficult?"], ["p", "Beyond romance, Fleming's story also draws attention to the silence surrounding women's health. Growing up, she had little useful education about reproductive health, consent, or bodily autonomy. She knew that using a tampon hurt, but had no understanding of why. It took multiple doctors before her condition was identified."], ["p", "Without an explanation, she began to question herself, wondering whether her experience made her a bad partner or somehow less capable of having a fulfilling relationship. Looking back, her message to her younger self is simple: \"You are not broken, your pain is real, and your worth as a partner is not measured by what your body can or cannot do.\""], ["p", "Interestingly, she chose to explore such a personal subject through romantic comedy. Humour, she explains, has always been a survival mechanism for her. It allows readers to approach subjects they might otherwise find uncomfortable. But she was careful not to make Emma's pain the joke. Readers can laugh at the awkwardness of dating and medical appointments while still feeling the weight of the loneliness and vulnerability underneath."], ["p", "Fleming began writing the novel at twenty-two, long before securing a publishing deal. Her original intention was to create the kind of cultural reference point she wished she had growing up. Today, she hopes the book helps people living with vaginismus, other chronic conditions, or insecurities about intimacy feel less alone. She also hopes it encourages couples to speak more openly about sexual health, pain, and boundaries."], ["p", "Perhaps that is what makes <em>Thighs Wide Shut</em> more than a second-chance romance. Beneath its humour and love story is a challenge to the idea that physical difficulties must define the course of a relationship. Fleming offers readers a different possibility: that intimacy can take many forms, and that love can grow even when life does not follow the expected script."]], "views": 2890, "bn": 53}, {"slug": "katherine-garbera", "img": "/img/author-katherine-garbera.jpg", "book": "The Naughty List Agreement", "author": "Katherine Garbera", "genre": "Christmas Romance", "title": "Holiday Chaos, Fake Vows, and the Daily Ritual of Romance: Inside Katherine Garbera’s The Naughty List Agreement", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "For most readers, holiday romance promises instant magic: twinkling lights, hot cocoa, and effortless cheer. Yet for Katherine Garbera, bestselling author of The Naughty List Agreement, December is just as defined by high-stakes logistics and workplace friction."], ["p", "In her advent-style novel, festival organizer Cora Quill faces a professional crisis when her Winter Wonderland loses its toy supplier. Her only lifeline is Nick Bari, the grumpy toymaker she previously fired, who happens to need a wife before Christmas Eve to keep his position as Santa Claus."], ["p", "\"For anyone who has ever planned a major event, December is pure, high-pressure logistics,\" Garbera explains. Grounding a whimsical premise in real professional history strips away polite small talk, forcing Cora and Nick to confront each other with immediate friction and sharp honesty."], ["h", "Friction Built on Shared Values"], ["p", "Writing an enemies-to-lovers dynamic around two stubborn protagonists requires balancing genuine conflict with believable chemistry. For Garbera, the key lies in giving her characters clashing methods rather than clashing morals."], ["p", "While Cora is a perfectionist planner and Nick is an artisanal creator who plays by his own rules, both care deeply about preserving holiday magic for their community. \"You have to let the audience see the respect growing right alongside the irritation,\" she notes. Even amid fake vows and festival chaos, Garbera anchors the comedy in quiet vulnerability, allowing the pretense to shift from a business arrangement into emotional safety."], ["h", "Unwrapping a Story One Day at a Time"], ["p", "Beyond its playful premise, The Naughty List Agreement reimagines how readers experience holiday fiction through its enclosed, chapter-a-day structure designed to be read throughout December."], ["p", "Writing for a daily ritual rather than a weekend binge reshaped Garbera’s approach to momentum. \"Every single chapter has to function like a little gift, complete with its own emotional beat, spark of banter, or cliffhanger,\" she says. That structure keeps anticipation building naturally right up to Christmas Day."], ["h", "Letting Go of Holiday Perfection"], ["p", "Ultimately, Garbera believes readers return to Christmas romance each year because the season carries real-world pressure alongside nostalgia, making a warm, hopeful ending feel essential."], ["p", "Beneath the banter and festive bargains, Cora and Nick’s story offers a simple reminder for anyone trying to single-handedly orchestrate the season: you don't have to carry the magic alone. \"The best partnerships happen when you drop the need to be perfect and let someone meet you halfway,\" Garbera reflects."]], "views": 3088, "bn": 54}, {"slug": "lyra-parish", "img": "/img/author-lyra-parish.jpg", "book": "Candy Cane Crush", "author": "Lyra Parish", "genre": "Holiday Romance", "title": "Off the Script: How Lyra Parish Turns Fake Dating into Real Vulnerability", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "In holiday romance, escapism often begins with a familiar fantasy: snow-dusted streets, glowing fireplaces, and effortless chemistry. Yet for Lyra Parish, author of Candy Cane Crush, the spark of a December love story is sharpest when it collides with a real-world burden."], ["p", "In the second standalone installment of her Seasonal Swoon series, a woman buried under medical school debt agrees to spend December pretending to be billionaire Thatcher’s girlfriend in exchange for millions. Rather than treating her financial strain as a passing detail, Parish uses it to ground the story’s high-gloss premise."], ["p", "\"Anyone who has stared down massive student loans knows that kind of pressure isn't abstract; it dictates every choice you make,\" Parish explains. Because her heroine enters the arrangement to buy back her future, she approaches the month like a job, determined to keep her heart out of the contract."], ["h", "The Safety of Pretending"], ["p", "For Parish, the enduring appeal of the fake-dating trope lies in the psychological cover it provides. When two guarded people convince themselves a relationship is merely a performance, they lower their usual defenses."], ["p", "\"When you tell yourself this is just an act, you drop the usual armor you wear on a real first date,\" she notes. Holding hands, sharing late-night conversations, or defending each other in front of family suddenly feels permissible. That dynamic challenges both characters differently: while the heroine protects her independence against growing feelings, Thatcher must confront the gap between performing competence for his parents and being emotionally present with someone who sees past his wealth."], ["h", "A Setting That Forces Closeness"], ["p", "Parish treats the novel’s small mountain town as an active participant rather than a passive backdrop. Snowed-in evenings, tight-knit family traditions, and meddling exes strip away easy exits, nudging the pair from rehearsed banter into genuine intimacy."], ["p", "Ultimately, Candy Cane Crush succeeds by delivering the cozy warmth readers expect from a seasonal romance while offering a grounded reminder about control. Both protagonists enter December with rigid exit strategies, only to discover that real connection requires stepping off the script."], ["p", "\"Some of the best things in life happen when your carefully laid plans fall apart,\" Parish reflects. \"Real intimacy isn't a performance you can control; it requires letting someone actually know you.\""]], "views": 1028, "bn": 55}, {"slug": "sam-taylor", "img": "/img/author-sam-taylor.jpg", "book": "A Meal in Winter", "author": "Hubert Mingarelli", "genre": "Historical Fiction", "title": "The Weight of the Unsaid: How Sam Taylor Brought Hubert Mingarelli’s A Meal in Winter into English", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "When literature confronts the Holocaust, it often reaches for monumental scale to match the enormity of history. Yet in A Meal in Winter, the late French novelist Hubert Mingarelli, and his English translator, Sam Taylor, achieves something far quieter and infinitely more unsettling: a moral reckoning confined to a single frozen day, an abandoned Polish cottage, and a pot of soup."], ["p", "Set during World War II, the novella follows three exhausted German soldiers who volunteer to hunt Jews in the countryside to avoid standing on the firing squad back at camp. By outsourcing the final trigger-pull, they convince themselves their hands remain clean. For Taylor, who brought the book to English-language readers, that self-deception is precisely what makes the story so piercing."], ["p", "\"You see how ordinary people accommodate atrocity, not through grand evil, but through small compromises designed to protect their own comfort and conscience,\" Taylor explains."], ["h", "Domesticity as a Moral Trap"], ["p", "Rather than relying on grand speeches, Mingarelli builds unbearable tension through physical survival: breaking furniture for firewood, rubbing frozen hands, and preparing a meal while their captive sits in the corner."], ["p", "To Taylor, those ordinary rituals sharpen rather than soften the horror. Sharing food is humanity’s oldest gesture of fellowship; once the soldiers sit down to eat, the abstract label of \"prisoner\" collapses into a starving human being right in front of them. Told through an unnamed narrator, the story strips away historical distance, forcing readers to witness the exact mental gymnastics people use to avoid facing the consequences of their obedience."], ["h", "Translating Silence"], ["p", "Preserving Mingarelli’s stripped-back style required fierce editorial discipline. Where English naturally favors polish and explanation, Mingarelli’s French relies on spoken cadence and deliberate gaps."], ["p", "\"The biggest danger in translation is over-explaining,\" Taylor notes. \"When a character pauses, repeats a simple phrase, or changes the subject while stirring a pot of soup, the silence is the meaning.\" By paring every sentence back until it sounded like a real person thinking out loud in the freezing cold, Taylor preserved the unspoken dread hovering beneath every casual remark."], ["h", "Why It Endures"], ["p", "Since Mingarelli’s death in 2020, A Meal in Winter has continued to resonate precisely because the vulnerabilities it exposes are not locked in the past. Looking away, following orders, and shifting responsibility remain permanent human temptations."], ["p", "Ultimately, Taylor believes the novella endures as a quiet warning: recognizing another person's humanity is never a passive feeling, but an active choice that demands courage."]], "views": 3433, "bn": 56}, {"slug": "louise-mayberry", "img": "/img/author-louise-mayberry.jpg", "book": "Roses in Red Wax", "author": "Louise Mayberry", "genre": "Historical Romance", "title": "The Cost of Comfort: How Louise Mayberry Brings Conscience and Radical History to Romance", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "Traditional Regency and historical romance often treats wealth as effortless glamour: grand estates and endless leisure floating comfortably above the machinery that funds them. Yet in Roses in Red Wax, the opening novel of the Darnalay Castle series, Louise Mayberry moves past gilded ballrooms into the smoke, music, and labor unrest of 1820 Scotland."], ["p", "Set against the volatile backdrop of industrial expansion and the Scottish Radical War, the novel pairs two characters standing on opposite sides of loss and awakening. Jane, the illegitimate daughter of a Scottish Earl, has been stripped of her home, her betrothed, and the orchard she cultivated by hand. Percy, a musician and heir to an industrialist fortune, has spent his life enjoying artistic freedom while ignoring the brutal factory conditions and child labor sustaining his family’s wealth."], ["p", "For Mayberry, placing a romantic hero at the center of that moral reckoning was deliberate. \"Percy thought despising his father’s business absolved him of it, even while spending the profits,\" she explains. True maturity requires him to confront the luxury of looking away."], ["h", "Grief Beyond Status"], ["p", "Just as Percy must reckon with privilege, Jane’s arc expands what historical heroines are allowed to mourn. Having no legal birthright, Jane found her identity and independence in the orchard she nurtured through her own patience and labor."], ["p", "\"I wanted readers to feel that a woman’s grief isn't only about romance or status; it is also about the work she loves and the quiet independence she built for herself,\" Mayberry notes. Neither character offers the other a fairy-tale escape; instead, Jane pierces Percy’s illusions while he reminds her that she is still allowed to hope."], ["h", "Where Intimacy Meets Insurgency"], ["p", "Grounded in factory commission testimonies and the history of Glasgow’s textile workers, Roses in Red Wax refuses to separate private affection from public justice. Every choice Percy makes regarding his family's mills directly impacts the people around Jane, turning stolen moments of music and tenderness into a refuge amidst rising insurgency."], ["p", "Ultimately, Mayberry leaves readers with a quiet challenge that reaches far beyond nineteenth-century Scotland: genuine love and justice demand the same courage."], ["p", "\"Privilege often depends on distance, on not seeing the people who pay the price for our ease,\" she reflects. \"Whether in 1820 Scotland or today, genuine love and justice both ask the same thing of us: to look closely, to care deeply even when it costs us something.\""]], "views": 2575, "bn": 57}, {"slug": "bill-byrnes", "img": "/img/author-bill-byrnes.jpg", "book": "Broken Cross", "author": "Bill Byrnes", "genre": "Religious Thriller", "title": "The Peril of Proof: How Bill Byrnes Turns Ancient Scripture into a Modern Thriller", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "Religious thrillers often rely on secret societies and breathless chases, yet the strongest entries in the genre draw their real voltage from a quieter question: what happens when an institution built on eternal truth confronts evidence that could undo it?"], ["p", "In Broken Cross, author and former university professor Bill Byrnes anchors a globe-trotting conspiracy in a deeply personal crisis of faith. When Jesuit scholar Tom Lache is framed for the murder of a Muslim archaeologist in Cappadocia, he finds himself on the run, and tasked with deciphering the Gospel of Longinus, an ancient text suggesting that Christ planned and survived the crucifixion."], ["p", "For Byrnes, placing a devoted priest rather than a cynic at the center of that discovery was essential. \"If a skeptic uncovers a text that challenges religious doctrine, the stakes are purely intellectual,\" he explains. \"When a Jesuit priest and scholar uncovers it, the stakes become deeply personal and spiritual.\""], ["h", "Three Traditions, One Mystery"], ["p", "Rather than framing the mystery through a single religious lens, Byrnes brings the three Abrahamic traditions into direct dialogue. A Muslim archaeologist makes the discovery, a Catholic priest deciphers the parchment, and Rachel Goldman, a New York Times investigative reporter and the daughter of a rabbi, tracks the modern conspiracy."], ["p", "Goldman refuses to function as a passive sidekick. Her journalistic skepticism cuts through Lache’s theological blind spots, while her upbringing gives her an intuitive grasp of scripture and community. Together, they bridge ancient caves and modern forensic laboratories, where carbon dating and DNA analysis transform a two-thousand-year-old manuscript into a contemporary geopolitical weapon."], ["h", "Institutional Power vs. Honest Inquiry"], ["p", "As Tom and Rachel flee assassins and the Vatican’s own enigmatic spymaster, Broken Cross examines the timeless friction between institutional self-preservation and individual conscience. When vast institutions prioritize stability over open inquiry, truth itself becomes dangerous."], ["p", "Ultimately, Byrnes is not asking readers to abandon their beliefs, but to examine how they confront uncomfortable questions. \"Genuine faith and honest questioning don't have to be enemies,\" he reflects. \"Sometimes the hardest, most uncomfortable questions are the very ones that lead us to a deeper understanding of ourselves.\""]], "views": 5754, "bn": 58}, {"slug": "jean-fullerton", "img": "/img/author-jean-fullerton.jpg", "book": "Christmas with the East End Girls", "author": "Jean Fullerton", "genre": "Historical Saga", "title": "Candlelight in the Blackout: How Jean Fullerton Turns Wartime Endurance into Festive Grace", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "By December 1943, the early adrenaline of the London Blitz had faded into grinding exhaustion. Four years of rationing, blackout curtains, and nightly air raids left little room for sentimentality. Yet for Jean Fullerton, author of Christmas with the East End Girls, that bleak winter is precisely where holiday storytelling finds its sharpest meaning."], ["p", "\"When you have very little left (no sugar for a proper pudding, no new clothes, and constant uncertainty), celebrating Christmas isn't frivolous; it becomes an act of defiance,\" Fullerton explains."], ["p", "In the latest installment of her East End Girls series, Fullerton brings together two people quietly trying to rebuild their lives: Georgina \"George\" St John-Smythe, a spirited Women’s Auxiliary Air Force volunteer nursing a recent heartbreak while fighting a false criminal accusation, and Captain Reverend Guy Moncrieff, an army chaplain invalided out of service and struggling to find purpose in a bomb-scarred parish."], ["h", "Fragility and Double Standards"], ["p", "Rather than softening the Home Front, Fullerton grounds her romance in the unspoken pressures of wartime life. Women in uniform stepped into vital roles yet remained vulnerable to gossip and institutional doubt, while injured servicemen carried the quiet grief of being sidelined while the war still raged."], ["p", "Throwing George and Guy together to organize a Christmas Eve carol service removes the pressure of courtship. Neither is looking for romance; instead, they heal through shared duty and dry East End humor. \"The darker the winter night outside,\" Fullerton notes, \"the brighter a simple candle looks inside.\""], ["h", "The Architecture of Solidarity"], ["p", "Having grown up in London’s East End, Fullerton treats community not as nostalgic backdrop, but as a survival mechanism. Working-class streets operated like extended families long before 1939, and when George’s reputation and livelihood are threatened, the East End Girls rally around her without waiting to be asked."], ["p", "Ultimately, Christmas with the East End Girls endures because its portrait of resilience speaks directly to modern uncertainty. Fullerton leaves readers with a grounded reminder: endurance is rarely a solo act."], ["p", "\"Resilience isn't about never feeling knocked down,\" she reflects. \"It’s about having friends who will stand by you, a community that lifts you up, and the grace to believe that fresh starts are always possible.\""]], "views": 9352, "bn": 59}, {"slug": "fulton-j-sheen", "img": "/img/author-fulton-j-sheen.jpg", "book": "Life of Christ", "author": "Fulton J. Sheen", "genre": "Faith & Spirituality", "title": "The Cross at the Center of History: How Fulton J. Sheen’s Life of Christ Speaks to Modern Restlessness", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "Biographies of Jesus often split into two camps: detached historical reconstructions that strip away mystery, or devotional retellings that float above history altogether. Published in 1958 after more than twenty-five years of research and daily prayer, Archbishop Fulton J. Sheen’s Life of Christ endures precisely because it refuses that divide."], ["p", "Trained as a philosopher and celebrated as one of the twentieth century’s most compelling communicators, Sheen approaches the Gospels with dramatic urgency. Rather than treating first-century Judea as a distant museum exhibit, he diagnoses modern anxieties (loneliness, materialism, and the hunger for power) and reveals them staring back from Scripture. Figures like Herod and Pilate emerge not as archaic relics, but as recognizable portraits of human pride attempting to manage life on its own terms."], ["h", "A Crown Without a Cross"], ["p", "At the heart of Sheen’s vision lies an arresting thesis: every other person entered the world to live, whereas Christ alone entered it to die. In Sheen’s reading, the Crucifixion is never an unforeseen political tragedy at the end of an inspiring career; it is the central purpose of the Incarnation, casting its shadow all the way back to Bethlehem."], ["p", "That lens reframes familiar Gospel episodes into piercing moral reckonings. In his analysis of the Temptations in the Desert, Sheen strips away centuries of routine familiarity to expose three permanent human shortcuts: reducing happiness to material comfort, trading truth for cheap spectacle, and grasping at power without sacrifice."], ["h", "Why Depth Endures"], ["p", "More than four decades after Sheen’s death in 1979, Life of Christ continues to draw both newcomers and lifelong believers. In an era crowded with fleeting self-help trends and fragmented noise, Sheen’s prose refuses to talk down to its audience, pairing sharp philosophical logic with lyrical tenderness."], ["p", "Ultimately, the book’s lasting power rests on its refusal to offer easy comfort. By showing that modern restlessness is often a deeper spiritual thirst, Sheen leaves readers with a timeless challenge: true meaning is never found in self-indulgence, but in the courage of self-giving love."]], "views": 2433, "bn": 60}, {"slug": "catherine-cowles", "img": "/img/author-catherine-cowles.jpg", "book": "Beautifully Broken Life", "author": "Catherine Cowles", "genre": "Romantic Suspense", "title": "The Architecture of Safety: How Catherine Cowles Turns Trauma and Fame into Small-Town Sanctuary", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "Romantic suspense often derives its momentum from external danger: shadows in the dark, ticking clocks, and secrets threatening to detonate. Yet for Catherine Cowles, bestselling author of Beautifully Broken Life, the sharpest tension lives inside the quiet, daily labor of learning to trust again."], ["p", "Set in the close-knit community of Sutter Lake, the second standalone novel in Cowles’s series pairs two people living behind carefully constructed masks. Tessa has altered nearly every detail of her identity to outrun a dangerous past, walking an exhausting tightrope between wanting connection and fearing what closeness might cost. Liam, a celebrity accustomed to the relentless scrutiny of tabloids, recognizes that hyper-vigilance immediately, having learned firsthand how quickly public attention can dismantle a private life."], ["p", "\"Both of them are living behind carefully constructed masks to protect themselves,\" Cowles explains. That shared instinct allows them to recognize each other’s wounds long before either speaks a word of truth."], ["h", "Consistency Over Spectacle"], ["p", "When writing characters shaped by anxiety and past trauma, Cowles rejects grand romantic gestures in favor of steady, predictable presence. In one of the novel’s defining moments, Liam helps Tessa through a panic attack, not by trying to fix her or take control, but by matching her breathing and anchoring her until the storm passes."], ["p", "For Cowles, vulnerability never diminishes a heroine’s strength; surviving those moments demands courage. When Tessa repeatedly pushes Liam away, it is not dramatic speeches that crack her armor, but quiet consistency. \"Safety is built in the accumulation of kept promises,\" she notes."], ["h", "Loving Through the Scars"], ["p", "Rather than letting external threats distract from the romance, Cowles uses suspense as an emotional catalyst, forcing Tessa to confront her fear of being truly known, and challenging Liam to drop his polished public armor."], ["p", "Ultimately, Beautifully Broken Life pushes back against the cultural myth that people must be completely healed before they deserve deep connection. Cowles leaves readers with a grounded truth: scars do not disqualify anyone from joy."], ["p", "\"You don't have to erase your past to build a radiant future,\" she reflects. \"The right person won't ask you to hide your scars; they will love you right through them.\""]], "views": 5432, "bn": 61}, {"slug": "emily-gunnis", "img": "/img/author-emily-gunnis.jpg", "book": "A Child in the Storm", "author": "Emily Gunnis", "genre": "Historical Mystery", "title": "Unfinished Sentences: How Emily Gunnis Traces Motherhood and Silence Across Four Decades", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "Dual-timeline fiction often treats the past as a picturesque backdrop, a nostalgic mirror held up to modern dilemmas. Yet for Emily Gunnis, bestselling author of historical mysteries, history is never merely behind us; it is an unfinished sentence waiting to be completed in the present."], ["p", "In her latest novel, Gunnis weaves together three women separated by more than forty years yet bound by a single buried secret. The story begins in 1983, when seventeen-year-old Felicity becomes pregnant, faces immediate rejection from her family, and suffers the loss of her newborn child. Four decades later, in 2024, Adele’s daughter disappears, triggering an investigation that exposes the quiet evasions hiding inside her own household."], ["p", "Drawn from real testimonies of coerced adoptions and mother-and-baby homes in Britain, Gunnis’s narrative challenges the assumption that such injustices vanished at mid-century. \"What affected me most wasn't just the legal and social pressure they faced,\" she explains, \"but the lasting psychological toll of being told to simply 'move on and forget,' as if motherhood could be erased by paperwork.\""], ["h", "Solidarity in the Mud"], ["p", "To counter the isolation forced upon Felicity at home, Gunnis sets part of her 1983 timeline at the Greenham Common Women’s Peace Camp, where thousands of women endured freezing winters and public hostility to protest nuclear weapons."], ["p", "Placing a disgraced teenager inside that grassroots movement creates a striking moral contrast. Where family and authorities demanded Felicity’s silence, the women of Greenham offered collective strength, showing her what female courage looked like when women refused to stay in their prescribed places."], ["h", "The Architecture of Family Myths"], ["p", "Across both timelines, Gunnis examines motherhood stripped down to raw survival instinct. Whether fighting an institutional system in 1983 or confronting paralysis and mistrust during a modern disappearance, both Felicity and Adele reveal that maternal devotion does not fade with time."], ["p", "Ultimately, the novel indicts the quiet damage inflicted by secrets kept in the name of \"protecting\" loved ones. While old wrongs cannot always give back forty lost years, Gunnis leaves readers with a clear conviction: bringing hidden histories into the light is where healing begins."]], "views": 2345, "bn": 62}, {"slug": "jack-kearney-behind-the-walls", "img": "/img/book-inside-out.jpg", "book": "Inside Out", "author": "Jack Kearney", "genre": "Prison Drama", "title": "Behind the Walls: How Jack Kearney Explores Survival and Justice in INSIDE OUT", "dek": null, "byline": null, "body": [["p", "In INSIDE OUT, author Jack Kearney explores how quickly life can change and how unexpected circumstances can reveal the strength of the human spirit. Set in California in 1978, the novel follows Danny Belson, an actor convicted of a crime he didn't commit and sent to a prison where he once taught acting to inmates. Suddenly, his former students become the people he must face as a fellow prisoner."], ["p", "Drawing from his own experiences as a struggling actor for more than 25 years and teaching inmates at the federal prison in Lompoc, Kearney builds a story rooted in personal insight. \"I started wondering what would happen if an actor who had once stood in front of those inmates as their teacher suddenly found himself standing beside them as a prisoner,\" he explains."], ["h", "When Life Takes an Unexpected Turn"], ["p", "Through Danny's experience, Kearney examines how little control people sometimes have over their circumstances. \"We sometimes believe we have more control over our lives than we really do,\" he reflects. The novel encourages readers to consider how they might respond if everything they worked for suddenly disappeared."], ["h", "The Past Behind Prison Walls"], ["p", "Danny's previous relationship with the inmates creates an unusual tension. Some remember him as their teacher and may offer support, while others could make his situation more difficult. \"The past doesn't simply disappear when Danny enters prison,\" Kearney says. \"In many ways, it follows him through those prison walls.\""], ["h", "The Strength to Survive"], ["p", "Beyond its prison setting, INSIDE OUT is ultimately a story about resilience, friendship, and hope. Kearney wants readers to recognize that even in the most difficult circumstances, the human spirit can endure."], ["p", "\"Ultimately, I want people to think about what true justice really means,\" he reflects. Through Danny's journey, Kearney reminds readers that life's unexpected challenges can reveal strengths they never knew they possessed."]], "views": 0, "bn": 63, "sub": false}, {"slug": "jack-kearney-hollywood-dreams", "img": "/img/book-inside-out.jpg", "book": "Inside Out", "author": "Jack Kearney", "genre": "Prison Drama", "title": "From Hollywood Dreams to Literary Ambition: How Jack Kearney Found a New Voice Through Writing", "dek": null, "byline": null, "body": [["p", "Before becoming the author of INSIDE OUT, Jack Kearney spent more than 25 years pursuing his dream of becoming an actor. A graduate of the American Academy of Dramatic Arts in Los Angeles, he appeared in television shows including MASH, WKRP in Cincinnati, and General Hospital. But behind the Hollywood dream were years of uncertainty, disappointment, and persistence."], ["p", "\"It was a journey of excitement, disappointment, and persistence,\" Kearney reflects. Those experiences shaped his understanding of ambition and eventually influenced the characters and themes of his novel."], ["h", "The Reality Behind Hollywood Dreams"], ["p", "Although Hollywood offered exciting opportunities, success was never guaranteed. Kearney often had to find other ways to support himself while continuing to pursue acting and writing. Those struggles gave him a deeper understanding of perseverance and disappointment."], ["h", "From Acting to Storytelling"], ["p", "Writing became another creative outlet for Kearney, who developed audition monologues and script treatments before beginning INSIDE OUT as a screenplay in 1983. \"It was my personal 'Rocky,'\" he says, describing a project he believed in so strongly that he imagined starring in it himself."], ["h", "A Story That Found Its Moment"], ["p", "After years of development, Kearney's rewritten screenplay received the Most Outstanding Screenplay award at the Hollywood Golden Film Awards in 2020. The recognition was especially meaningful after the original screenplay struggled to gain industry acceptance because of its raw portrayal of prison violence."], ["p", "\"Sometimes a story simply needs time,\" he reflects."], ["h", "The Actor Behind the Writer"], ["p", "For Kearney, acting and writing share an important foundation: understanding people. His years as an actor taught him to observe emotions, motivations, and human behavior, skills that continue to shape his storytelling."], ["p", "\"As an actor, you're constantly trying to understand a character's motivations. As a writer, you have to create those motivations yourself.\""]], "views": 0, "bn": 63, "sub": true}, {"slug": "jack-kearney-beyond-the-labels", "img": "/img/book-inside-out.jpg", "book": "Inside Out", "author": "Jack Kearney", "genre": "Prison Drama", "title": "Beyond the Labels: How Jack Kearney Turns Real-Life Experiences Into Fiction in INSIDE OUT", "dek": null, "byline": null, "body": [["p", "Some stories begin with imagination, while others grow from experiences that leave a lasting impression. For Jack Kearney, INSIDE OUT was inspired by his 1978 experience leading an acting workshop for inmates at the federal prison in Lompoc, California. What began as an unusual opportunity eventually became the foundation for a novel exploring human nature, judgment, and the stories behind people's lives."], ["h", "Where Fiction Meets Reality"], ["p", "Kearney never expected the prison workshop to inspire a novel. However, meeting the inmates and seeing them beyond society's usual perceptions left a lasting impression. Years later, those memories became the starting point for a story he had never initially imagined writing."], ["h", "A Personal Experience That Changed Everything"], ["p", "A life-changing situation in which twelve witnesses helped keep Kearney from potentially facing prison transformed his perspective. It made him reflect on how easily circumstances can alter someone's future and encouraged him to reconsider the men he had met in Lompoc."], ["h", "Real People, Complex Characters"], ["p", "Two major characters in INSIDE OUT are based on inmates Kearney encountered during the workshop. He wanted to portray them as complex individuals rather than simply good or bad, drawing on real observations to give the story greater emotional depth."], ["h", "Beyond Society's Labels"], ["p", "For Kearney, one of the novel's most important messages is that people cannot be fully understood through appearances or assumptions. Listening to their experiences often reveals a much more complicated reality."], ["p", "As he reflects, people are more than the labels society gives them. Through INSIDE OUT, Kearney encourages readers to look beyond the surface and recognize the humanity behind every individual."]], "views": 0, "bn": 63, "sub": true}, {"slug": "jack-kearney-beyond-incarceration", "img": "/img/book-inside-out.jpg", "book": "Inside Out", "author": "Jack Kearney", "genre": "Prison Drama", "title": "Beyond Incarceration: How Jack Kearney Explores Humanity, Justice, and Hope in INSIDE OUT", "dek": null, "byline": null, "body": [["p", "While INSIDE OUT explores the harsh realities of prison life, author Jack Kearney places humanity at the heart of the story. Through Danny Belson's journey, the novel examines justice, friendship, survival, and the resilience required to find hope in the darkest circumstances."], ["p", "\"People are rarely as simple as we sometimes imagine,\" Kearney explains. His story challenges readers to look beyond appearances and consider how circumstances can change lives."], ["h", "The Meaning of True Justice"], ["p", "One of the novel's deeper themes is the difference between legal judgment and genuine justice. Kearney explores how official decisions do not always reflect a person's understanding of the truth, particularly when freedom and the future are at stake."], ["h", "The Power of Friendship"], ["p", "As Danny navigates prison life, trust becomes essential. Surrounded by people with different motives, he must discover who genuinely wants to help him and who poses a threat. Kearney believes human connections can provide the strength needed to survive even the most difficult situations."], ["h", "Strength Beyond Survival"], ["p", "For Kearney, survival is about more than physical strength. It requires mental resilience, adaptability, and the ability to confront unexpected challenges. Through Danny, he explores how extraordinary circumstances can reveal qualities people never knew they possessed."], ["h", "Finding Hope in the Darkness"], ["p", "Despite its difficult subject matter, INSIDE OUT carries an important message of hope. Kearney believes that even in the darkest moments, people can find friendship, strength, and reasons to keep moving forward."], ["p", "Ultimately, the novel is more than a story about prison. It is a reminder that the human spirit can endure, adapt, and find hope even when life seems to have taken everything away."]], "views": 0, "bn": 63, "sub": true}, {"slug": "jack-kearney-never-giving-up", "img": "/img/book-inside-out.jpg", "book": "Inside Out", "author": "Jack Kearney", "genre": "Prison Drama", "title": "The Power of Never Giving Up: How Jack Kearney Keeps Dreaming and Creating Through the Years", "dek": null, "byline": null, "body": [["p", "For Jack Kearney, INSIDE OUT is more than a novel; it is the result of decades of persistence, creativity, and belief in a story worth telling. Beginning as a screenplay in 1983, inspired by his acting career and experiences with inmates, the project eventually evolved into the book it is today."], ["p", "\"In many ways, the book represents persistence and the importance of holding on to something you believe in,\" Kearney reflects."], ["h", "The Courage to Keep Dreaming"], ["p", "Despite years of uncertainty and creative disappointments, Kearney never abandoned storytelling. Balancing his ambitions with the practical demands of life, he continued believing there would always be another story worth pursuing. For him, being a dreamer means refusing to give up when the journey becomes difficult."], ["h", "Dreams That Can Change the World"], ["p", "Kearney lives by a memorable saying: \"Dreamers rarely rule the world… but they can change it.\" He believes dreamers may not always hold positions of power, but their ideas, creativity, and stories can inspire others and change perspectives."], ["h", "Creativity Has No Expiration Date"], ["p", "Now in his seventies, Kearney continues to pursue his creative ambitions. He sees the experiences, relationships, and lessons gathered throughout life as valuable inspiration for storytelling. \"I'm still a dreamer, and I still have stories I want to tell,\" he says."], ["h", "A Message for Those Who Refuse to Give Up"], ["p", "Reflecting on his journey with INSIDE OUT, Kearney encourages anyone with an unfulfilled dream to remain patient and persistent. A dream may take decades to become reality, but that doesn't mean it should be abandoned."], ["p", "His final message captures the spirit of his journey: \"Dreamers rarely rule the world… but they can change it.\""]], "views": 0, "bn": 63, "sub": true}, {"slug": "alex-finlay-the-anniversary", "img": "/img/author-alex-finlay-the-anniversary.jpg", "book": "The Anniversary", "author": "Alex Finlay", "genre": "Thriller", "title": "A single calendar date can hold a lifetime hostage.", "dek": "Writing under a pseudonym from Washington, D.C., bestselling thriller author Alex Finlay trades relentless hour-by-hour ticking clocks for a decade-long reckoning. In The Anniversary, he traces two teenagers bound by a single night of terror in 1992—exploring how survival leaves its own quiet scars, and why fate refuses to let the past stay buried.", "byline": "Bestselling Thriller Author & Supreme Court Litigator", "body": [["h", "The Book"], ["p", "The Anniversary: A Thriller, published 12 May 2026"], ["h", "The Case"], ["p", "On May 1, 1992, two seventeen-year-olds in a small Midwestern town have their lives shattered: popular Jules Delaney survives a brutal attack by the elusive May Day Killer, while Quinn Riley is arrested after breaking up a fight—only to return home from juvenile detention to his mother’s unsolved murder. Over the next decade, their paths collide strictly on May 1st of each year as two dark mysteries converge."], ["p", "When asked why The Anniversary needed to exist, Alex Finlay doesn’t begin with the mechanics of a serial killer hunt. He begins with the quiet, lingering weight of a single date on a calendar. Across the conversation, it becomes clear that while the elusive May Day Killer provides the chilling spine of the novel, Finlay’s deeper preoccupation is what happens to ordinary people in the long aftermath of violence. On May 1, 1992, two seventeen-year-olds from opposite sides of a small Midwestern town—high school queen bee Jules Delaney and working-class outcast Quinn Riley—have their futures permanently rerouted. For Jules, surviving an attack meant to be fatal brings an unbearable question: why was she spared? For Quinn, a wrongful arrest leads to an even darker homecoming when he emerges from juvenile detention to find his mother murdered."], ["p", "As the exchange unfolds, Finlay explains how the emotional core of the story grew out of watching two wounded strangers become the only people capable of understanding each other’s grief. Rather than treating trauma as a backdrop for action, he places it squarely at the center of their connection. Jules and Quinn are separated by class, reputation, and circumstance, yet bound by a night neither can outrun. Watching Finlay unpack their decade-long orbit, you recognize that he approaches suspense less like a puzzle to be solved and more like an inquiry into fate, guilt, and the fragile resilience required to let light back into a broken life."], ["q", "“A thriller works best when you care less about catching the monster in the dark than you do about whether the people left standing in the morning can ever truly heal.”", "ALEX FINLAY ON JULES AND QUINN"], ["p", "That commitment to character intimacy also dictated the novel’s daring structure. After juggling sprawling multi-perspective casts in earlier hits like Parents Weekend, Finlay stripped The Anniversary down to two central voices—and confined the entire narrative to a single recurring day, May 1st, revisited once a year over ten years. Giving readers only an annual snapshot forces the imagination to bridge the twelve months in between. Each return to May 1st feels like opening a door onto a slightly altered room, letting subtle shifts in loyalty, buried town secrets, and growing closeness accumulate naturally until the tension becomes suffocating."], ["p", "By the end of the conversation, the discussion turns toward what lingers once the final twist lands and the decade closes. Finlay hopes The Anniversary is remembered not merely for its propulsive turns, but as a story about innocent lives interrupted—and the stubborn grace it takes to keep moving forward when the past refuses to stay quiet. And if he could sit beside a single reader the moment they finished the final page, he wouldn’t ask when they guessed the killer’s identity. He would ask something far more personal: “Which year of their lives stayed with you longest—and what date on your own calendar changed everything?”"]], "views": 0, "bn": 64}, {"slug": "karin-slaughter-last-breath", "img": "/img/author-karin-slaughter-last-breath.jpg", "book": "Last Breath", "author": "Karin Slaughter", "genre": "Crime Thriller", "title": "Protecting someone always comes at a cost.", "dek": "Best known for sprawling, relentlessly paced crime novels, Karin Slaughter narrows her lens in Last Breath to explore the quiet devastation of a childhood shattered overnight. Stepping into the courtroom alongside defense attorney Charlie Quinn, she examines how survivor’s guilt shapes the choices we make—and what happens when empathy clouds our judgment.", "byline": "#1 New York Times Bestselling Crime & Legal Thriller Author", "body": [["h", "The Book"], ["p", "Last Breath (The Good Daughter Prequel Novella), originally published 11 July 2017; new paperback edition released 20 October 2026"], ["h", "The Case"], ["p", "At thirteen, Charlie Quinn’s childhood ended violently when two men with a grudge against her lawyer father broke into their home. Now a defense attorney determined to shield the powerless, Charlie takes on the case of motherless honor student Flora Faulkner—only to discover that her young client’s secrets run far deeper than she ever imagined."], ["p", "When asked why Last Breath needed to exist alongside her full-length novels, Karin Slaughter doesn’t begin with courtroom strategy or the mechanics of a legal thriller. She begins with memory—specifically, the kind of trauma that refuses to stay locked in the past. Across the conversation, it becomes clear that this compact, razor-sharp story was born from a desire to understand Charlie Quinn before the world ever met her in The Good Daughter. At thirteen, Charlie learned firsthand how fragile safety truly is when violence crossed the threshold of her family’s home. Becoming a lawyer was never merely a career choice for her; it was an attempt to stand between the vulnerable and the dark."], ["p", "As the discussion unfolds, Slaughter unpacks the dangerous blind spot created by that very instinct. When Flora Faulkner—a motherless teenager with nowhere else to turn—begs for help, Charlie doesn’t just see a client in trouble. She sees a reflection of her thirteen-year-old self. Watching Slaughter trace that emotional collision, you realize the true suspense of Last Breath does not come from who broke the law, but from how easily our own unhealed wounds can make us misread someone else’s intentions."], ["q", "“When you’ve spent your life trying to be the person who saves others, the hardest truth to accept is that someone might be using your own past as a shield.”", "KARIN SLAUGHTER ON CHARLIE QUINN’S DILEMMA"], ["p", "Writing the story as a tight, fast-moving novella demanded a different kind of discipline than her multi-layered series work. In a shorter format, there is no room for sprawling subplots or gradual detours; every scene has to carry both legal tension and psychological weight. Slaughter notes that placing Charlie inside a compressed ticking-clock investigation strips away the usual procedural armor. Without the luxury of time, Charlie is forced to confront an agonizing ethical line: how far should a defense attorney go to protect a client, and at what point does loyalty turn into complicity?"], ["p", "Even years after its initial digital release—and as a new wave of readers discovers the story through its 2026 paperback edition and screen adaptation of The Good Daughter—Slaughter sees Last Breath as an intimate character study disguised as a legal mystery. Beneath the twists and buried secrets lies a sobering question about trust: whether we ever truly know the people we fight to defend, or if we simply project onto them the innocence we wish we had never lost."], ["p", "By the end of the exchange, the conversation turns toward what lingers once the final page is turned. Slaughter hopes Last Breath stays with readers not just for the shock of its revelations, but for the quiet ache of Charlie’s realization that good intentions cannot rewrite someone else’s choices. And if she could sit beside a single reader the moment they finished the story, she wouldn’t ask whether they guessed the final twist. She would lean over and ask: “At what point would you have walked away—and why do we keep defending people even after the truth starts to crack?”"]], "views": 0, "bn": 65}, {"slug": "karin-slaughter-the-secrets-we-hide", "img": "/img/author-karin-slaughter-the-secrets-we-hide.jpg", "book": "The Secrets We Hide", "author": "Karin Slaughter", "genre": "Crime Thriller", "title": "Nothing stays buried forever.", "dek": "Returning to the tight-knit town of North Falls, Karin Slaughter turns a quiet residential street into the epicenter of a town-wide reckoning. In The Secrets We Hide, she probes what happens when everyone in a community knows each other’s names, yet no one is telling the truth—and why silence can be just as destructive as violence.", "byline": "#1 International Bestselling Crime & Thriller Author", "body": [["h", "The Book"], ["p", "The Secrets We Hide: A North Falls Thriller (North Falls, Book 2), published 11 August 2026"], ["h", "The Case"], ["p", "When gunshots shatter the afternoon calm at 1601 Iris Drive in North Falls, Georgia, Sheriff Emmy Clifton and her sister, former federal agent Jude Archer, find former police officer Allison Vickery murdered in her kitchen and her teenage daughter left for dead upstairs. While town gossip rushes to convict Allison’s estranged husband, Emmy uncovers a deeper web of decades-old secrets that reach the highest levels of local power."], ["p", "When asked why The Secrets We Hide needed to follow on the heels of North Falls’ first tremor, Karin Slaughter does not start with the mechanics of a whodunit. She starts with the quiet weight of secrecy itself. Across the conversation, it becomes clear that behind the shocking crime scene at 1601 Iris Drive sits a broader psychological study: how the things people bury shape who they become, and how silence can simultaneously protect and corrode an entire community. In North Falls, everyone knows everyone’s business on the surface, yet the town is built on unspoken histories that refuse to stay underground."], ["p", "As the exchange unfolds, Slaughter unpacks the distinct trap of policing a small town where bloodlines and loyalties overlap at every corner. Stepping back into the shoes of acting Sheriff Emmy Clifton—still grieving her mother while navigating the fallout of her previous case—meant placing an investigator in a room where almost every witness is a neighbor, a relative, or an old acquaintance. Rumors spread faster than evidence, and the town quickly settles on an easy culprit in Allison Vickery’s volatile, absent husband. Yet Slaughter is far more interested in the cracks beneath that consensus, showing how a community’s eagerness to point a single finger often serves to shield its own complicity."], ["q", "“Silence has a way of pretending to be protection, until you realize it is the very thing keeping everyone trapped in the dark.”", "KARIN SLAUGHTER ON NORTH FALLS"], ["p", "At the emotional center of that investigation is the fragile, evolving partnership between Emmy and her sister, Jude Archer, a former FBI profiler who returned home after decades away. Writing from both perspectives allowed Slaughter to contrast two very different ways of reading a room: Emmy’s instinct- driven familiarity with the town’s pulse against Jude’s measured, outsider scrutiny. Even as Jude serves as a steady sounding board to help Emmy sift through clues and motives, an unspoken secret between the sisters lingers beneath their dialogue, mirroring the very concealment they are trying to dismantle across Clifton County."], ["p", "Setting the story over a compressed span of days with longer, deliberate chapters also gave the narrative room to breathe beneath the tension. Rather than relying solely on breakneck chase sequences, Slaughter lets the dread accumulate in kitchens, porches, and quiet conversations where people carefully edit what they are willing to admit. As clues tie the attack on a former police officer back to a controversial trial from years earlier, the personal and the institutional collide, revealing how trauma echoes across generations when left unexamined."], ["p", "By the close of the conversation, the discussion turns toward what stays with a reader once the final twist lands. Slaughter hopes The Secrets We Hide is remembered not just for its suspense, but for its unflinching look at how far ordinary people will go to guard their reputations—and the grace required to face hard truths. And if she could sit beside a single reader the moment they finished the final page, she wouldn't ask who they suspected first. She would ask: “Which silence in this town felt most familiar to you?”"]], "views": 0, "bn": 66}, {"slug": "alexandra-joel-the-paris-model", "img": "/img/author-alexandra-joel-the-paris-model.jpg", "book": "The Paris Model", "author": "Alexandra Joel", "genre": "Historical Fiction", "title": "Glamour is only the surface of a secret.", "dek": "Before turning to fiction, Alexandra Joel spent decades decoding identity from two very different angles: as the editor of Harper’s Bazaar and as a practising psychotherapist. In The Paris Model, she traces a young woman’s journey from a vast Australian sheep station to the haute couture salons of postwar Paris, uncovering how easily a life can be stitched together—and how quickly a hidden past can unravel it.", "byline": "Author, Former Magazine Editor & Psychotherapist", "body": [["h", "The Book"], ["p", "The Paris Model: A Novel, published 20 January 2020 (Australia) / 1 September 2020 (US)"], ["h", "The Story"], ["p", "Following a shocking discovery about her past, Grace Woods leaves behind her family’s Australian sheep station for tumultuous postwar Paris. Working as a mannequin for Christian Dior amidst counts, artists, and diplomats, she falls for the enigmatic Philippe Boyer—unaware that his double life in international espionage will place her own life in peril."], ["p", "When asked why The Paris Model needed to be written, Alexandra Joel doesn’t begin with the silk gowns of Christian Dior or the glittering salons of late-1940s France. She begins with a far quieter, sharper question: what happens when the foundation of your identity turns out to be a lie? Across the conversation, it becomes clear that while postwar Paris provides an intoxicating backdrop, the true engine of the novel is psychological. Having worked both at the helm of major fashion magazines and inside a psychotherapy practice, Joel understands intimately how people use outward polish to conceal private fracture lines."], ["p", "As the exchange unfolds, Joel reflects on Grace Woods, a young woman raised in the wide, unvarnished isolation of an Australian sheep station who suddenly finds herself standing under the chandeliers of Avenue Montaigne. On paper, stepping into the role of a Dior mannequin looks like the ultimate reinvention. Yet as Joel observes, moving across the world does not erase the questions you carry inside you. In a city still nursing the fresh wounds of the Second World War, everyone around Grace—from aristocrats and artists to the enigmatic Philippe Boyer—is curating what they want the world to see while guarding what lies underneath."], ["q", "“Couture can transform the silhouette a woman presents to the world, but it cannot rewrite the truth of where she came from.”", "Alexandra Joel on identity and reinvention"], ["p", "Writing that tension required blending rigorous historical research with emotional suspense. Inspired by an astonishing true story, Joel spent years immersing herself in the texture of liberation-era Paris, where ration cards existed alongside extravagant soirées and Cold War espionage simmered beneath polite conversation. By placing Grace at the intersection of high fashion and covert intrigue, the narrative refuses to treat glamour as mere decoration. Every fitting, every whispered introduction, and every stolen glance with Philippe becomes a clue in a much larger puzzle about loyalty, betrayal, and survival."], ["p", "Moving from non-fiction biography and fashion history into her debut novel also allowed Joel to explore the interior lives of women navigating rigid social expectations. In non-fiction, a writer is bound strictly to the surviving paper trail; in fiction, she notes, you are free to step inside the silence between historical facts and ask what it actually felt like to stand in that room. Grace’s courage isn’t found in the dresses she models, but in her refusal to look away once she realizes her own origins—and her heart—have been caught in someone else’s game."], ["p", "By the end of the conversation, the focus turns to what lingers after the final page is closed. Joel hopes The Paris Model is remembered not only as an immersive journey through a vanished era of elegance, but as a story about the resilience required to claim your own name. And if she could sit beside a single reader the moment they finished the book, she wouldn’t ask which Dior gown they pictured most vividly. She would ask something far more revealing: “If you discovered your entire past had been built on a secret, would you still want to know the truth?”"], ["n", "Synthesized from verified bibliographic records, publisher materials, and Alexandra Joel’s documented commentary on The Paris Model."]], "views": 0, "bn": 67}, {"slug": "jodi-picoult-salem-falls", "img": "/img/author-jodi-picoult-salem-falls.jpg", "book": "Salem Falls", "author": "Jodi Picoult", "genre": "Contemporary Fiction", "title": "A label can outlive the truth.", "dek": "Before courtroom drama became her signature canvas, Jodi Picoult reimagined The Crucible for a modern New England town where gossip moves faster than justice. In Salem Falls, she follows a man trying to wash away a wrongful conviction one dish at a time, asking what happens when a community decides an accusation is already a verdict.", "byline": "#1 New York Times Bestselling Author", "body": [["h", "The Book"], ["p",
