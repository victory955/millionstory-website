he is pregnant, she keeps it from him while his enemies close in.", "p": "Independently published", "pd": "2 November 2026"}, {"n": 53, "t": "Thighs Wide Shut", "a": "Hayley Fleming", "g": "Romance", "i": "img/author-hayley-fleming.jpg", "l": "https://www.amazon.com/s?k=Thighs+Wide+Shut+Hayley+Fleming", "d": "Emma moves to Boston for a fresh start and finds herself living beneath Harrison, the college friend she fell out with years ago. A second chance is on offer, but only if she can face the medical condition that has kept her from intimacy.", "p": "Dial Press (US) / Quercus (UK)", "pd": "21 July 2026"}, {"n": 54, "t": "The Naughty List Agreement", "a": "Katherine Garbera", "g": "Romance", "i": "img/author-katherine-garbera.jpg", "l": "https://www.amazon.com/Naughty-List-Agreement-enemies-lovers/dp/000881483X", "d": "Festival organiser Cora Quill loses her toy supplier and turns to Nick Bari, the grumpy toymaker she once fired, who needs a wife by Christmas Eve to keep his place as Santa. The book is an advent romance with 25 sealed chapters, one to open each day.", "p": "One More Chapter", "pd": "29 September 2026"}, {"n": 55, "t": "Candy Cane Crush", "a": "Lyra Parish", "g": "Romance", "i": "img/author-lyra-parish.jpg", "l": "https://www.amazon.com/Candy-Cane-Crush-small-town-holiday-themed/dp/B0HQ2HGLKS", "d": "A woman buried in medical school debt agrees to spend December posing as billionaire Thatcher’s girlfriend in exchange for a fortune. Snowed in at a small mountain town, the pretence starts to feel real. Book two of the Seasonal Swoon series, and it reads as a standalone.", "p": "Happily Ever After Ink", "pd": "1 November 2026"}, {"n": 56, "t": "A Meal in Winter", "a": "Hubert Mingarelli", "g": "Historical Fiction", "i": "img/author-sam-taylor.jpg", "l": "https://www.amazon.com/Meal-Winter-Novel-World-War/dp/1620974843", "d": "Three German soldiers head into the frozen Polish countryside, sent to bring back a Jew for execution. A short novel of World War II, translated by Sam Taylor, that turns on one shared meal.", "p": "The New Press", "pd": "9 October 2018"}, {"n": 57, "t": "Roses in Red Wax", "a": "Louise Mayberry", "g": "Romance", "i": "img/author-louise-mayberry.jpg", "l": "https://www.amazon.com/Roses-Red-Wax-Darnalay-Castle/dp/B0BV49MJ11", "d": "In 1820 Glasgow, Jane Stuart has lost her betrothed, her ancestral castle and the orchard she tended by hand. Percy, a musician from an industrialist’s family, draws her back toward hope as unrest spreads through the mills. Book one of the Darnalay Castle series.", "p": "Louise Mayberry", "pd": "8 February 2023"}, {"n": 58, "t": "Broken Cross", "a": "Bill Byrnes", "g": "Mystery & Thriller", "i": "img/author-bill-byrnes.jpg", "l": "https://www.amazon.com/Broken-Cross-Bill-Byrnes-ebook/dp/B0HCW6VC81", "d": "Jesuit scholar Tom Lache is framed for the murder of a Muslim archaeologist in Cappadocia and goes on the run with reporter Rachel Goldman. Their only lead is an ancient gospel claiming that Christ planned and survived the crucifixion.", "p": "Black Rose Writing", "pd": "5 November 2026"}, {"n": 59, "t": "Christmas with the East End Girls", "a": "Jean Fullerton", "g": "Historical Fiction", "i": "img/author-jean-fullerton.jpg", "l": "https://www.amazon.com/Christmas-East-Girls-unputdownable-heart-warming/dp/1805500872", "d": "East London, 1943. George is nursing a recent heartbreak while fighting a false accusation, and Guy, an army chaplain invalided out of service, is struggling to find purpose in a bomb-damaged church. Book four of The East End Girls.", "p": "Bookouture", "pd": "2 October 2026"}, {"n": 60, "t": "Life of Christ", "a": "Fulton J. Sheen", "g": "General Nonfiction", "i": "img/author-fulton-j-sheen.jpg", "l": "https://www.amazon.com/s?k=Life+of+Christ+Fulton+J.+Sheen", "d": "Archbishop Fulton J. Sheen’s biography of Jesus, the fruit of more than twenty-five years of research and writing, follows Christ’s life through to the Paschal Mystery. First published in 1958.", "p": "Image / Doubleday", "pd": "1958 (first edition)"}, {"n": 61, "t": "Beautifully Broken Life", "a": "Catherine Cowles", "g": "Romance", "i": "img/author-catherine-cowles.jpg", "l": "https://www.amazon.com/Beautifully-Broken-Life-Sutter-Lake/dp/1733596321", "d": "Tessa has found a safe haven in Sutter Lake, hiding in plain sight under a new identity. Liam, worn down by the darker side of fame, retreats there too, and the two find a connection neither expected. Book two of the Sutter Lake series.", "pd": "25 June 2019"}, {"n": 62, "t": "A Child in the Storm", "a": "Emily Gunnis", "g": "Mystery & Thriller", "i": "img/author-emily-gunnis.jpg", "l": "https://www.amazon.com/Child-Storm-pulse-pounding-page-turner-bestselling-ebook/dp/B0DT6LJWH9", "d": "In 1983, pregnant at seventeen and turned out by her parents, Felicity finds refuge at the Greenham Common peace camp, until a police raid and the loss of her newborn. In 2024, another woman is haunted by a night that left her alone, and three women are bound by one secret.", "p": "Headline Review", "pd": "31 July 2025"}];

const JR=[{"slug": "notes-from-a-reader", "cat": "Life", "title": "Notes from a Reader", "date": "Sep 28, 2026", "img": "pen", "excerpt": "Some things about reading are hard to explain, like why one sentence stays with you for years while hundreds of others disappear.", "body": [["p", "Some things about reading are hard to explain, like why you remember exactly where you were when you read a certain book, or why one sentence stays with you for years while hundreds of others quietly disappear."], ["p", "Some books arrive at the wrong time. You can read ten pages and feel nothing. Then, two years later, you open the same book and wonder how you ever missed it."], ["p", "Some characters become strangely familiar. You know they aren't real, you know their lives exist only on paper, and yet you find yourself wondering what they would do in a situation that has nothing to do with the story at all."], ["p", "We underline things we don't fully understand yet. A sentence can mean very little the first time we read it. Then life happens, and we come back to find we suddenly understand exactly why we marked it."], ["p", "And sometimes the best thing a book can do is make us look up, away from the page, away from the noise, and back at our own lives."], ["p", "Maybe that's why we keep returning to books. Not because every book changes us. But because, every now and then, one does."]]}, {"slug": "care-for-slower-reading", "cat": "Reading", "title": "Care for Slower Reading", "date": "Oct 10, 2026", "img": "sun", "excerpt": "Somewhere along the way, reading became another thing to keep up with. Maybe we don't need to read more. Maybe we need to read slower.", "body": [["p", "There was a time when reading didn't feel like something we had to be good at. You picked up a book because you wanted to know what happened next, read a few pages before bed, carried it with you somewhere, stopped halfway through because someone called your name, and came back to it later. There was no target, no streak, no number of books you were supposed to finish by the end of the month. You were simply reading."], ["p", "Somewhere along the way, reading became another thing to keep up with. We count how many books we've read. We make lists of what we want to finish. We photograph them, post them, set challenges for ourselves. There's nothing wrong with any of that, but sometimes it's worth asking whether, in trying to read more, we've forgotten how to read slowly."], ["h", "The strange pressure to finish"], ["p", "A book can start to feel demanding the moment we treat it like a task. We think about how many pages are left, calculate how long it will take, wonder whether we're reading quickly enough, and something that was supposed to take us somewhere begins to feel like somewhere we have to get through."], ["p", "Perhaps that's why so many people say they want to read more but struggle to actually sit down with a book. It isn't that they stopped loving stories. Maybe they simply grew tired of turning reading into work."], ["p", "There's something different about reading when you have nowhere else to be, when you can stop at a sentence because it catches you, reread a paragraph because you liked the sound of it, or put the book down for a moment because a character said something that stayed with you. None of that looks especially productive. It might be the whole point."], ["h", "We are surrounded by speed"], ["p", "Almost everything around us moves quickly. Messages arrive instantly. Videos get shorter. News comes in headlines. We scroll past hundreds of things without staying with any of them for long, and even when something interests us, there's usually another thing waiting right underneath it."], ["p", "Reading asks for something different. It asks you to stay, not forever, just long enough. Long enough for a sentence to settle, for a character to become familiar, for a world that didn't exist in your mind ten minutes ago to start feeling real."], ["p", "That kind of attention can feel uncomfortable once we've grown used to constant movement. But discomfort isn't always a sign that something is wrong. Sometimes it's simply what happens when we slow down."], ["h", "The book you don't finish"], ["p", "It's worth saying something about the books we never finish: you're allowed to leave one. A book isn't a contract. Sometimes the timing is wrong, sometimes the story isn't for you, and sometimes you simply don't want to know what happens next."], ["p", "And sometimes you put a book down for six months and discover you weren't finished with it after all, you just weren't ready yet."], ["p", "There's a strange freedom in knowing you don't have to conquer every book you begin. Reading isn't a competition. The book doesn't care how quickly you finish it, and maybe neither should you."], ["h", "Coming back"], ["p", "Maybe the answer isn't finding more time to read, but learning to treat reading differently. Put your phone somewhere you can't reach it. Read ten pages, and don't worry about whether ten pages is enough. If you want to stop, stop. If you want to continue, continue."], ["p", "Let yourself read badly sometimes. Let your focus wander and come back. Let yourself spend twenty minutes on the same page because your mind went somewhere else. There's no perfect way to return to reading, only the moment you pick up a book again, and that's usually enough."], ["p", "Because books were never meant to be another thing we hurry through. They offer something much of modern life rarely does: a reason to stay in one place for a while. So maybe we don't need to read more. Maybe, for a little while, we just need to read slower."]]}, {"slug": "the-rise-of-the-book-club", "cat": "Books", "title": "The Rise of the Book Club", "date": "Oct 2, 2026", "img": "books", "excerpt": "You come together to talk about a book. You often leave having talked about yourselves.", "body": [["p", "There's something slightly strange about a book club: a group of people voluntarily agree to read the same book, meet somewhere, and then spend an evening discussing fictional people as though they were mutual acquaintances. And somehow, it works."], ["p", "Reading is usually a solitary thing. You sit alone with a book, turn the pages alone, and the story unfolds somewhere inside your own head. A book club changes that. Suddenly your favourite character belongs to someone else's imagination too, someone hated the person you loved, someone noticed something you missed entirely, someone read the ending completely differently. The book becomes bigger than its pages."], ["p", "Perhaps that's why book clubs continue to matter, not because everyone needs another social activity, but because books give people something worth gathering around. So much of our lives now happens through short messages, quick reactions and passing conversation. A book asks us to sit down and actually talk."], ["p", "And rarely just about the book. A good book club conversation has a way of turning into a conversation about family, relationships, fear, ambition, grief, love, or the strange decisions people make. The book simply gives everyone somewhere to begin."], ["p", "Maybe that's the real magic of it. You come together to talk about a book. You often leave having talked about yourselves."]]}, {"slug": "what-makes-a-story-last", "cat": "Writing", "title": "What Makes a Story Last?", "date": "Oct 6, 2026", "img": "shelf", "excerpt": "Not how loudly a story announces itself, but how quietly it stays with us after we've finished reading.", "body": [["p", "Some stories disappear almost as soon as we finish them. We close the book, put it back on the shelf, and move on. Then there are the others."], ["p", "Years later, we can still remember a character's name, a particular scene, a sentence we underlined, sometimes without remembering the plot at all, just how the story made us feel."], ["p", "So what makes a story last? Probably not perfection. Some of the books we remember most clearly aren't the ones we'd call flawless. They simply met us at the right moment."], ["p", "A story can attach itself to a particular version of ourselves, the person who read it, the place we read it, whatever was happening in our life at the time. That might be why the same book can mean something entirely different when we return to it years later. The story hasn't necessarily changed. We have."], ["p", "That may be one of the quiet powers of stories: they give us something to carry forward, and sometimes we don't realise what we've carried until much later."], ["p", "A memorable story doesn't always leave us with an answer. Sometimes it leaves us with a question, or changes how we see someone, or simply hands us a sentence we needed at exactly the right moment."], ["p", "Maybe that's what makes a story last, not how loudly it announces itself, but how quietly it stays with us after we've finished reading."]]}];

<div><div class="k">Our Mission</div><h2 class="serif" style="font-size:32px;margin:8px 0 16px;line-height:1.2">To discover, explore and share the stories behind the books.</h2><p style="color:var(--mut);font-size:18.5px;line-height:1.7">We believe every book has a bigger story: the people, experiences, ideas and questions that shaped it. Million Story exists to bring those stories to light through curated book discovery, author conversations and thoughtful editorial content.</p></div>
<div><div class="k">Our Values</div><div class="vlist">${[["01","Curiosity","We ask deeper questions and look beyond the surface."],["02","Authenticity","We value real conversations, real people and honest stories."],["03","Community","We\'re building a space where readers, authors and storytellers can connect and grow."],["04","Impact","We believe stories have the power to inform, inspire and create change."]].map(v=>`<div class="vrow"><span class="vn">${v[0]}</span><div><h3 class="serif">${v[1]}</h3><p>${v[2]}</p></div></div>`).join('')}</div></div>
<div class="vbox"><div class="k">Our Vision</div><h2 class="serif" style="font-size:26px;margin:8px 0 14px;line-height:1.25">A world where every book finds its people.</h2><p style="color:var(--mut);font-size:17px;line-height:1.7">We\'re just getting started, and we\'re excited to build this with our readers, authors and community.</p></div>
</div></section>
<section class="sec"><div class="fnd2"><div><div class="k">Meet the Founder</div><h2 class="serif" style="font-size:40px;margin:8px 0 16px">Hi, I\'m Faith.</h2><p style="font-size:18.5px;line-height:1.7;margin:0 0 14px">I started Million Story because I kept asking myself the same question: what happens when we look beyond the book itself? What if we could talk to the people behind the stories, understand the journey, and discover the bigger picture?</p><p style="font-size:18.5px;line-height:1.7;margin:0 0 24px">I\'m building Million Story as a space where books, people and ideas come together, one conversation at a time.</p><a href="#/contact" class="btn" style="background:transparent;color:var(--ink);border:1px solid var(--line)">Get in touch ${ar}</a></div><blockquote>“Stories aren\'t just meant to be read. They\'re meant to be explored.”<cite>Faith, Founder</cite></blockquote></div></section>

const FEATURES=[{
 slug:"george-kerpi",
 views:3477,
 bn:51,
 kicker:"Author Day · 1 November",
 pageKicker:"Behind the Book · Main Book for October",
 author:"George Kerpi",
 role:"Author and ER nurse",
 book:"Treacherous Path",
 lead:"George Kerpi’s <em>Treacherous Path</em> is",
 title:"our main book for October.",
 pageTitle:"No one is truly evil.",
 magazine:"img/feature-kerpi-magazine.jpg",
 magazineAlt:"Million Story magazine cover, Autumn 2026: George Kerpi on Treacherous Path",
 portrait:"img/feature-kerpi-portrait.jpg",
 cta:"Read the Full Conversation",
 intro:"George Kerpi writes crime fiction between emergency-room shifts. In <em>Treacherous Path</em> he built a murder investigation around a woman who is no longer there to speak. He tells us why it had to be a novel and not a poem, and the one question he would ask every reader.",
 details:[
  ["The Book","<em>Treacherous Path</em>, published 11 August 2026"],
  ["The Case","A hunting party brings a severed finger wearing a golden ring to the Oak Ridge sheriff’s office. Detective Captain Steven Harlan and his partner, Aaron Chase, are drawn into the disappearance of Dr. Natalie Brooks, a physician at a mountain resort, and find a carefully ordered life with cracks in it."]
 ],
 interview:[
  {q:"Why does Treacherous Path exist?",a:[
   "<strong class='ev'>Books are to teach.</strong> In my case, my book is written in a language that teaches through investigation that no one is truly evil. Any good or bad deed can be understood. Not necessarily agreed with, but understood, if you look at it from the perspective of a person of interest. Six to you is nine to me. Every sinner has a future, and every saint has a past.",
   "Does that explanation diminish the pain caused by the crime? No, it doesn’t. But every pain should be a lesson.",
   "<em>Treacherous Path</em> was supposed to be just an investigation of a crime committed, but I decided to honour Natalie’s memory by making it about each and every person involved. Even the place is involved. Once you read the book you realise the ending makes you ponder your own life. The crime against Natalie was grave, but it was also a scar on the memory of the town. It happened to them and the dwellers of the town. What did it do to the psychology of people who were either involved or heard about it?"]},
  {q:"Is there a character you found particularly difficult, or surprisingly easy, to write?",a:[
   "Natalie was probably the most difficult character for me to write. I wanted to do justice to her memory. The entire book is built around the death of this one person, and in a way, everybody else is just garnish. They’re investigating her, talking about her, remembering her, suspecting each other because of what happened to her, but she isn’t there to speak for herself."]},
  {pull:"If the reader doesn’t care about the person who died, then ultimately, why should they care who killed her?",by:"George Kerpi on writing Natalie"},
  {q:"Why did the character have to be written this way?",a:[
   "That made her difficult for me because I didn’t want Natalie to become simply “the victim.” Natalie may have few opportunities to occupy the page, but she’s the reason any of them occupy it at all."]},
  {q:"Having written both fiction and poetry, what did Treacherous Path let you express that poetry couldn’t?",a:[
   "I love this question, because I asked it of myself. Poetry is a unique way of connecting with the rhyme of a story. You can almost sing poetry. But if you want to immerse yourself in the life of a story, or in the life of an individual character, a novel gives you greater access. It also gives you the simplicity of language that a story sometimes needs. A novel does not have to be memorized. It has to be understood.",
   "Surprisingly, I actually have a version of <em>Treacherous Path</em> that I attempted to write as poetry. I tried because one of the greatest inspirations of my life is the late Shota Rustaveli, the great Georgian poet who wrote <em>The Knight in the Panther’s Skin</em>, a work that has influenced Georgian literature and culture for centuries. To me, he is a divine writer. But as I worked on <em>Treacherous Path</em> in verse, I realised the genre simply did not sit right with the rhyme of the poetry. This story needed the freedom and space of a novel."]},
  {q:"How do you want the book to be remembered?",a:[
   "I want <em>Treacherous Path</em> to be remembered as a reminder to every generation that sometimes bad things happen to good people, and that vigilance is the key to any endeavour, good or bad. I want it to be a type of psychological milestone for every reader. Not necessarily groundbreaking, but something that lets a reader say, “I remember my life before <em>Treacherous Path</em>, and I know my life after.”"]},
  {q:"If you could sit beside one reader immediately after they finished the book, what would you most want to ask them?",a:[
   "The first thing I would ask is very simple: “Did you like it?”",
   "And then I think the rest of my questions would depend entirely on their answer. I would want to know what they liked, what they didn’t, who they believed, what surprised them, and what stayed with them.",
   "But there is one thing I would be most curious about: <strong class='ev'>Are you more of a person after reading <em>Treacherous Path</em> than you were before?</strong>",
   "Because to me, that is what a book should ultimately do. I don’t necessarily mean that it has to teach you something or change your beliefs. But if you spend that much time inside someone else’s fear, loss, suspicion, guilt, innocence, and humanity, I hope you come out of it carrying something you didn’t carry before."]}
 ]
}];

const AUTH=[{"slug": "natasha-l-black", "img": "img/author-natasha-l-black.jpg", "book": "Scarred Vows", "author": "Natasha L. Black", "genre": "Mafia Romance", "title": "The Architecture of Surrender: How Natasha L. Black Reimagines Power in Dark Romance", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "In contemporary romance fiction, few subgenres spark as much curiosity, or fierce devotion, as mafia romance. On the surface, its staples read like pure escapism: ruthless syndicate bosses and marriages forged in ledger books. Yet for Natasha L. Black, author of Scarred Vows: A Secret Baby, Mafia Romance, the criminal underworld is less an excuse for spectacle than a pressure cooker for human psychology."], ["p", "In Scarred Vows, Emma discovers her wedding is a transaction arranged to settle her father’s debts to Vladimir, a formidable Bratva leader. Rather than glossing over that imbalance, Black uses it as the novel’s dramatic engine."], ["p", "\"When a marriage starts as a financial transaction, neither character can pretend this is a fairytale,\" Black explains. For her, the story only truly begins when both characters dismantle that coercion to make room for genuine choice."], ["h", "Restraint Over Control"], ["p", "Crafting a protagonist like Vladimir requires balancing moral ambiguity with a hero readers can root for. Though he commands a brutal hierarchy, Vladimir refuses to force Emma’s affection, waiting instead for her to say yes on her own terms."], ["p", "\"In dark romance, it is easy to write a man who simply takes what he wants,\" Black notes. \"To me, that’s predictable.\" True strength, she argues, appears in restraint, paired with a strict ethical boundary. While a hero may be merciless to rivals, cruelty toward the heroine is off-limits. \"The moment a hero strips away the heroine's humanity rather than respecting her strength, you lose the romance.\""], ["h", "Reclaiming Agency"], ["p", "In a world where powerful men treat women as collateral, Black ensured Emma’s strength comes from sharp instincts and boundary-setting rather than passive waiting. That resilience is tested most when Emma discovers she is pregnant and delays telling Vladimir."], ["p", "Instead of using the \"secret baby\" trope for mere melodrama, Black uses it to examine the difference between being possessed and truly belonging. \"When your marriage starts as a ledger entry, you question where your value lies,\" she says. \"She has to ask: Will he love me as his wife, or will I simply become more valuable property?\""], ["h", "Beyond the Transaction"], ["p", "Black’s appeal reflects why readers gravitate toward high-stakes romance in uncertain times: stories built on fierce protection and hard-won trust offer real catharsis."], ["p", "Beneath the suspense, Scarred Vows leaves readers with a grounded truth about commitment. A vow forced by circumstance is merely a contract; a marriage only becomes real when two people are free to walk away and choose to stay anyway."], ["p", "\"Your starting point doesn't have to define your ending,\" Black reflects. \"Real loyalty isn't something you can buy or demand; it’s something you earn.\""]], "views": 1790, "bn": 52}, {"slug": "hayley-fleming", "img": "img/author-hayley-fleming.jpg", "book": "Thighs Wide Shut", "author": "Hayley Fleming", "genre": "Romantic Comedy", "title": "Beyond the Pages: Hayley Fleming on Love, Intimacy, and the Courage to Feel Whole", "dek": "In her debut novel, <em>Thighs Wide Shut</em>, Hayley Fleming explores a side of romance rarely discussed in fiction. Drawing from personal experience, she tells a story about intimacy, vulnerability, and learning to feel at home in one's own body.", "byline": null, "body": [["p", "Romance novels often promise that love will make everything fall into place. But what happens when two people find each other, the feelings are real, and yet the body refuses to follow the script?"], ["p", "It is a question that sits at the heart of Hayley Fleming's debut novel, <em>Thighs Wide Shut</em>. The story follows Emma, a young woman navigating an unexpected second chance at love while confronting a health condition that has made physical intimacy difficult. What appears to be a familiar romance gradually reveals something more personal: an exploration of vulnerability, intimacy, and the complicated relationship between love and the human body."], ["p", "The connection between Fleming and her protagonist is not accidental. Her own experience with vaginismus, a condition that can make penetration painful or difficult, helped shape Emma's journey. But writing the character also brought Fleming face to face with feelings she thought she had already worked through."], ["p", "She describes Emma as sharing her emotional DNA, particularly the fear of being broken or somehow unworthy of a relationship. Even after years of therapy, writing the character made her recognise how much of that fear she still carried. The hardest scenes were not necessarily the physical ones, but the quieter experiences: the anxiety before a date, the loneliness of explaining a condition, and the exhaustion of trying to find words for something difficult to understand."], ["p", "That personal connection also shaped what she wanted to challenge about romance fiction. Having grown up reading the genre, she noticed how often physical intimacy is portrayed as an effortless reward once two people fall in love. Real life, however, is rarely that simple. Love does not automatically remove anxiety, trauma, or medical difficulties."], ["p", "Fleming wanted to show that when physical intimacy does not follow the familiar script, a relationship has not necessarily failed. Patience, communication, and vulnerability can create a deeper connection than physical attraction alone."], ["p", "Her perspective raises an interesting question: why do we so often measure romantic relationships by how easily two people fit together, rather than by how they understand and support each other when things become difficult?"], ["p", "Beyond romance, Fleming's story also draws attention to the silence surrounding women's health. Growing up, she had little useful education about reproductive health, consent, or bodily autonomy. She knew that using a tampon hurt, but had no understanding of why. It took multiple doctors before her condition was identified."], ["p", "Without an explanation, she began to question herself, wondering whether her experience made her a bad partner or somehow less capable of having a fulfilling relationship. Looking back, her message to her younger self is simple: \"You are not broken, your pain is real, and your worth as a partner is not measured by what your body can or cannot do.\""], ["p", "Interestingly, she chose to explore such a personal subject through romantic comedy. Humour, she explains, has always been a survival mechanism for her. It allows readers to approach subjects they might otherwise find uncomfortable. But she was careful not to make Emma's pain the joke. Readers can laugh at the awkwardness of dating and medical appointments while still feeling the weight of the loneliness and vulnerability underneath."], ["p", "Fleming began writing the novel at twenty-two, long before securing a publishing deal. Her original intention was to create the kind of cultural reference point she wished she had growing up. Today, she hopes the book helps people living with vaginismus, other chronic conditions, or insecurities about intimacy feel less alone. She also hopes it encourages couples to speak more openly about sexual health, pain, and boundaries."], ["p", "Perhaps that is what makes <em>Thighs Wide Shut</em> more than a second-chance romance. Beneath its humour and love story is a challenge to the idea that physical difficulties must define the course of a relationship. Fleming offers readers a different possibility: that intimacy can take many forms, and that love can grow even when life does not follow the expected script."]], "views": 2890, "bn": 53}, {"slug": "katherine-garbera", "img": "img/author-katherine-garbera.jpg", "book": "The Naughty List Agreement", "author": "Katherine Garbera", "genre": "Christmas Romance", "title": "Holiday Chaos, Fake Vows, and the Daily Ritual of Romance: Inside Katherine Garbera’s The Naughty List Agreement", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "For most readers, holiday romance promises instant magic: twinkling lights, hot cocoa, and effortless cheer. Yet for Katherine Garbera, bestselling author of The Naughty List Agreement, December is just as defined by high-stakes logistics and workplace friction."], ["p", "In her advent-style novel, festival organizer Cora Quill faces a professional crisis when her Winter Wonderland loses its toy supplier. Her only lifeline is Nick Bari, the grumpy toymaker she previously fired, who happens to need a wife before Christmas Eve to keep his position as Santa Claus."], ["p", "\"For anyone who has ever planned a major event, December is pure, high-pressure logistics,\" Garbera explains. Grounding a whimsical premise in real professional history strips away polite small talk, forcing Cora and Nick to confront each other with immediate friction and sharp honesty."], ["h", "Friction Built on Shared Values"], ["p", "Writing an enemies-to-lovers dynamic around two stubborn protagonists requires balancing genuine conflict with believable chemistry. For Garbera, the key lies in giving her characters clashing methods rather than clashing morals."], ["p", "While Cora is a perfectionist planner and Nick is an artisanal creator who plays by his own rules, both care deeply about preserving holiday magic for their community. \"You have to let the audience see the respect growing right alongside the irritation,\" she notes. Even amid fake vows and festival chaos, Garbera anchors the comedy in quiet vulnerability, allowing the pretense to shift from a business arrangement into emotional safety."], ["h", "Unwrapping a Story One Day at a Time"], ["p", "Beyond its playful premise, The Naughty List Agreement reimagines how readers experience holiday fiction through its enclosed, chapter-a-day structure designed to be read throughout December."], ["p", "Writing for a daily ritual rather than a weekend binge reshaped Garbera’s approach to momentum. \"Every single chapter has to function like a little gift, complete with its own emotional beat, spark of banter, or cliffhanger,\" she says. That structure keeps anticipation building naturally right up to Christmas Day."], ["h", "Letting Go of Holiday Perfection"], ["p", "Ultimately, Garbera believes readers return to Christmas romance each year because the season carries real-world pressure alongside nostalgia, making a warm, hopeful ending feel essential."], ["p", "Beneath the banter and festive bargains, Cora and Nick’s story offers a simple reminder for anyone trying to single-handedly orchestrate the season: you don't have to carry the magic alone. \"The best partnerships happen when you drop the need to be perfect and let someone meet you halfway,\" Garbera reflects."]], "views": 3088, "bn": 54}, {"slug": "lyra-parish", "img": "img/author-lyra-parish.jpg", "book": "Candy Cane Crush", "author": "Lyra Parish", "genre": "Holiday Romance", "title": "Off the Script: How Lyra Parish Turns Fake Dating into Real Vulnerability", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "In holiday romance, escapism often begins with a familiar fantasy: snow-dusted streets, glowing fireplaces, and effortless chemistry. Yet for Lyra Parish, author of Candy Cane Crush, the spark of a December love story is sharpest when it collides with a real-world burden."], ["p", "In the second standalone installment of her Seasonal Swoon series, a woman buried under medical school debt agrees to spend December pretending to be billionaire Thatcher’s girlfriend in exchange for millions. Rather than treating her financial strain as a passing detail, Parish uses it to ground the story’s high-gloss premise."], ["p", "\"Anyone who has stared down massive student loans knows that kind of pressure isn't abstract; it dictates every choice you make,\" Parish explains. Because her heroine enters the arrangement to buy back her future, she approaches the month like a job, determined to keep her heart out of the contract."], ["h", "The Safety of Pretending"], ["p", "For Parish, the enduring appeal of the fake-dating trope lies in the psychological cover it provides. When two guarded people convince themselves a relationship is merely a performance, they lower their usual defenses."], ["p", "\"When you tell yourself this is just an act, you drop the usual armor you wear on a real first date,\" she notes. Holding hands, sharing late-night conversations, or defending each other in front of family suddenly feels permissible. That dynamic challenges both characters differently: while the heroine protects her independence against growing feelings, Thatcher must confront the gap between performing competence for his parents and being emotionally present with someone who sees past his wealth."], ["h", "A Setting That Forces Closeness"], ["p", "Parish treats the novel’s small mountain town as an active participant rather than a passive backdrop. Snowed-in evenings, tight-knit family traditions, and meddling exes strip away easy exits, nudging the pair from rehearsed banter into genuine intimacy."], ["p", "Ultimately, Candy Cane Crush succeeds by delivering the cozy warmth readers expect from a seasonal romance while offering a grounded reminder about control. Both protagonists enter December with rigid exit strategies, only to discover that real connection requires stepping off the script."], ["p", "\"Some of the best things in life happen when your carefully laid plans fall apart,\" Parish reflects. \"Real intimacy isn't a performance you can control; it requires letting someone actually know you.\""]], "views": 1028, "bn": 55}, {"slug": "sam-taylor", "img": "img/author-sam-taylor.jpg", "book": "A Meal in Winter", "author": "Hubert Mingarelli", "genre": "Historical Fiction", "title": "The Weight of the Unsaid: How Sam Taylor Brought Hubert Mingarelli’s A Meal in Winter into English", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "When literature confronts the Holocaust, it often reaches for monumental scale to match the enormity of history. Yet in A Meal in Winter, the late French novelist Hubert Mingarelli, and his English translator, Sam Taylor, achieves something far quieter and infinitely more unsettling: a moral reckoning confined to a single frozen day, an abandoned Polish cottage, and a pot of soup."], ["p", "Set during World War II, the novella follows three exhausted German soldiers who volunteer to hunt Jews in the countryside to avoid standing on the firing squad back at camp. By outsourcing the final trigger-pull, they convince themselves their hands remain clean. For Taylor, who brought the book to English-language readers, that self-deception is precisely what makes the story so piercing."], ["p", "\"You see how ordinary people accommodate atrocity, not through grand evil, but through small compromises designed to protect their own comfort and conscience,\" Taylor explains."], ["h", "Domesticity as a Moral Trap"], ["p", "Rather than relying on grand speeches, Mingarelli builds unbearable tension through physical survival: breaking furniture for firewood, rubbing frozen hands, and preparing a meal while their captive sits in the corner."], ["p", "To Taylor, those ordinary rituals sharpen rather than soften the horror. Sharing food is humanity’s oldest gesture of fellowship; once the soldiers sit down to eat, the abstract label of \"prisoner\" collapses into a starving human being right in front of them. Told through an unnamed narrator, the story strips away historical distance, forcing readers to witness the exact mental gymnastics people use to avoid facing the consequences of their obedience."], ["h", "Translating Silence"], ["p", "Preserving Mingarelli’s stripped-back style required fierce editorial discipline. Where English naturally favors polish and explanation, Mingarelli’s French relies on spoken cadence and deliberate gaps."], ["p", "\"The biggest danger in translation is over-explaining,\" Taylor notes. \"When a character pauses, repeats a simple phrase, or changes the subject while stirring a pot of soup, the silence is the meaning.\" By paring every sentence back until it sounded like a real person thinking out loud in the freezing cold, Taylor preserved the unspoken dread hovering beneath every casual remark."], ["h", "Why It Endures"], ["p", "Since Mingarelli’s death in 2020, A Meal in Winter has continued to resonate precisely because the vulnerabilities it exposes are not locked in the past. Looking away, following orders, and shifting responsibility remain permanent human temptations."], ["p", "Ultimately, Taylor believes the novella endures as a quiet warning: recognizing another person's humanity is never a passive feeling, but an active choice that demands courage."]], "views": 3433, "bn": 56}, {"slug": "louise-mayberry", "img": "img/author-louise-mayberry.jpg", "book": "Roses in Red Wax", "author": "Louise Mayberry", "genre": "Historical Romance", "title": "The Cost of Comfort: How Louise Mayberry Brings Conscience and Radical History to Romance", "dek": null, "byline": "By the Editorial Director | Million Story", "body": [["p", "Traditional Regency and historical romance often treats wealth as effortless glamour: grand estates and endless leisure floating comfortably above the machinery that funds them. Yet in Roses in Red Wax, the opening novel of the Darnalay Castle series, Louise Mayberry moves past gilded ballrooms into the smoke, music, and labor unrest of 1820 volous; it becomes an act of defiance,\" Fullerton explains."], ["p", "In the latest installment of her East End Girls series, Fullerton brings together two people quietly trying to rebuild their lives: Georgina \"George\" St John-Smythe, a spirited Women’s Auxiliary Air Force volunteer nursing a recent heartbreak while fighting a false criminal accusation, and Captain Reverend Guy Moncrieff, an army chaplain invalided out of service and struggling to find purpose in a bomb-scarred parish."], ["h", "Fragility and Double Standards"], ["p", "Rather than softening the Home Front, Fullerton grounds her romance in the unspoken pressures of wartime life. Women in uniform stepped into vital roles yet remained vulnerable to gossip and institutional doubt, while injured servicemen carried the quiet grief of being sidelined while the war still raged."], ["p", "Throwing George and Guy together to organize a Christmas Eve carol service removes the pressure of courtship. Neither is looking for romance; instead, they heal through shared duty and dry East End humor. \"The darker the winter night outside,\" Fullerton notes, \"the brighter a simple candle looks inside.\""], ["h", "The Architecture of Solidarity"], ["p", "Having grown up in London’s East End, Fullerton treats community not as nostalgic backdrop, but as a survival mechanism. Working-class streets operated like extended families long before 1939, and when George’s reputation and livelihood are threatened, the East End Girls rally around her without waiting to be asked."], ["p", "Ultimately, Christmas with the East End Girls endures because its portrait of resilience speaks directly to modern uncertainty. Fullerton leaves readers with a grounded reminder: endurance is rarely a solo act."], ["p", "\"Resilience isn't about never feeling knocked down,\" she reflects. \"It’s about having friends who will stand by you, a community that lifts you up, and the grace to believe that fresh starts are always possible.\""]], "views <script>
